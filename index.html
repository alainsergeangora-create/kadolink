<script>
// ════════════════════════════════════════════════════════════════
// FIREBASE CONFIG — KADOLINK-B8023
// Remplacez ces valeurs par celles de votre Firebase Console
// Project Settings > General > Your apps > Web app
// ════════════════════════════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDV-HNmYbHoRYn-OjbvjyH651a1Mk6CJtI",
  authDomain: "kadolink-b8023.firebaseapp.com",
  databaseURL: "https://kadolink-b8023-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "kadolink-b8023",
  storageBucket: "kadolink-b8023.firebasestorage.app",
  messagingSenderId: "1065402171345",
  appId: "1:1065402171345:web:d43d0440e4e1a385e9aaf0"
};

// ════════════════════════════════════════════════════════════════
// FIREBASE INIT + FALLBACK
// ════════════════════════════════════════════════════════════════
let db = null;
let auth = null;
let FB_READY = false;

try {
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.firestore();
  // Offline persistence (IndexedDB)
  db.enablePersistence({ synchronizeTabs: true })
    .then(() => console.log('[KadoLink] Firestore offline persistence activée'))
    .catch(err => {
      if (err.code === 'failed-precondition') console.warn('[KadoLink] Multi-onglets: persistence désactivée');
      else if (err.code === 'unimplemented') console.warn('[KadoLink] Browser ne supporte pas la persistence offline');
    });
  // Activer Firebase (clés réelles détectées)
  FB_READY = true;
  console.log('[KadoLink] Firebase connecté ✅ — Projet kadolink-b8023');
} catch (e) {
  console.warn('[KadoLink] Firebase init échoué, mode localStorage activé:', e.message);
}

// ════════════════════════════════════════════════════════════════
// COUCHE STORAGE UNIVERSELLE — Firestore + localStorage fallback
// Toutes les opérations passent par cette couche
// ════════════════════════════════════════════════════════════════
const Storage = {
  // ── LocalStorage helpers (fallback) ──
  _lsKey: (tenantId, path) => `kl:${tenantId}:${path}`,
  _lsGet: (tenantId, path, def = null) => {
    try { const v = localStorage.getItem(Storage._lsKey(tenantId, path)); return v ? JSON.parse(v) : def; } catch { return def; }
  },
  _lsSet: (tenantId, path, val) => {
    try { localStorage.setItem(Storage._lsKey(tenantId, path), JSON.stringify(val)); } catch {}
  },
  _lsGGet: (path, def = null) => {
    try { const v = localStorage.getItem(`kl:global:${path}`); return v ? JSON.parse(v) : def; } catch { return def; }
  },
  _lsGSet: (path, val) => {
    try { localStorage.setItem(`kl:global:${path}`, JSON.stringify(val)); } catch {}
  },

  // ── Firestore helpers ──
  _col: (tenantId, col) => db?.collection('tenants').doc(tenantId).collection(col),
  _globalCol: (col) => db?.collection(col),

  // ── API publique — SYNC (localStorage) ──
  // Utilisée partout dans les composants pour lecture synchrone initiale
  get: (tenantId, path, def = null) => Storage._lsGet(tenantId, path, def),
  set: (tenantId, path, val) => {
    Storage._lsSet(tenantId, path, val);
    // Sync vers Firestore si disponible (best-effort, non-bloquant)
    if (FB_READY && db) {
      Storage._syncToFirestore(tenantId, path, val).catch(e => console.warn('Sync Firestore:', e));
    }
  },
  del: (tenantId, path) => {
    try { localStorage.removeItem(Storage._lsKey(tenantId, path)); } catch {}
  },
  gget: (path, def = null) => Storage._lsGGet(path, def),
  gset: (path, val) => {
    Storage._lsGSet(path, val);
    if (FB_READY && db) {
      Storage._syncGlobalToFirestore(path, val).catch(e => console.warn('Sync Global Firestore:', e));
    }
  },

  // ── Sync vers Firestore (arrays → subcollection ou document) ──
  _syncToFirestore: async (tenantId, path, val) => {
    if (!db) return;
    // path peut être: 'users', 'cards', 'lots', 'scans-{userId}'
    const docRef = db.collection('tenants').doc(tenantId).collection('_data').doc(path);
    await docRef.set({ value: val, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
  },
  _syncGlobalToFirestore: async (path, val) => {
    if (!db) return;
    const docRef = db.collection('_global').doc(path);
    await docRef.set({ value: val, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
  },

  // ── Chargement depuis Firestore (au login) ──
  loadFromFirestore: async (tenantId) => {
    if (!FB_READY || !db) return false;
    try {
      const snap = await db.collection('tenants').doc(tenantId).collection('_data').get();
      snap.forEach(doc => {
        const data = doc.data();
        if (data?.value !== undefined) {
          Storage._lsSet(tenantId, doc.id, data.value);
        }
      });
      return true;
    } catch (e) { console.warn('loadFromFirestore:', e); return false; }
  },
  loadGlobalFromFirestore: async () => {
    if (!FB_READY || !db) return false;
    try {
      const snap = await db.collection('_global').get();
      snap.forEach(doc => {
        const data = doc.data();
        if (data?.value !== undefined) {
          Storage._lsGSet(doc.id, data.value);
        }
      });
      return true;
    } catch (e) { console.warn('loadGlobalFromFirestore:', e); return false; }
  },

  // ── Abonnement temps-réel Firestore ──
  subscribe: (tenantId, path, callback) => {
    if (!FB_READY || !db) return () => {};
    const docRef = db.collection('tenants').doc(tenantId).collection('_data').doc(path);
    return docRef.onSnapshot(snap => {
      if (snap.exists) {
        const val = snap.data()?.value;
        Storage._lsSet(tenantId, path, val);
        callback(val);
      }
    });
  },
  subscribeGlobal: (path, callback) => {
    if (!FB_READY || !db) return () => {};
    const docRef = db.collection('_global').doc(path);
    return docRef.onSnapshot(snap => {
      if (snap.exists) {
        const val = snap.data()?.value;
        Storage._lsGSet(path, val);
        callback(val);
      }
    });
  },
};

// ════════════════════════════════════════════════════════════════
// FIREBASE AUTH — matricule + PIN → email synthétique
// Pattern: {matricule}@{tenantId}.kadolink.app
// ════════════════════════════════════════════════════════════════
const FirebaseAuth = {
  // Email synthétique pour Firebase Auth
  toEmail: (matricule, tenantId) => `${matricule.toLowerCase()}@${tenantId}.kadolink.app`,

  // Connexion
  signIn: async (matricule, pin, tenantId) => {
    if (!FB_READY || !auth) return null;
    const email = FirebaseAuth.toEmail(matricule, tenantId);
    try {
      const cred = await auth.signInWithEmailAndPassword(email, pin);
      return cred.user;
    } catch (e) {
      if (e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password') return null;
      console.warn('FirebaseAuth.signIn:', e);
      return null;
    }
  },

  // Création compte Firebase Auth (superadmin/admin créant un user)
  createAccount: async (matricule, pin, tenantId) => {
    if (!FB_READY || !auth) return false;
    const email = FirebaseAuth.toEmail(matricule, tenantId);
    try {
      await auth.createUserWithEmailAndPassword(email, pin);
      return true;
    } catch (e) {
      if (e.code === 'auth/email-already-in-use') return true; // compte déjà créé, OK
      console.warn('FirebaseAuth.createAccount:', e);
      return false;
    }
  },

  // Changement de PIN
  changePin: async (currentPin, newPin, matricule, tenantId) => {
    if (!FB_READY || !auth) return false;
    try {
      const email = FirebaseAuth.toEmail(matricule, tenantId);
      const cred = firebase.auth.EmailAuthProvider.credential(email, currentPin);
      await auth.currentUser?.reauthenticateWithCredential(cred);
      await auth.currentUser?.updatePassword(newPin);
      return true;
    } catch (e) {
      console.warn('FirebaseAuth.changePin:', e);
      return false;
    }
  },

  // Réinitialiser PIN admin → delete + recréer le compte Firebase Auth
  // C'est la seule façon côté client de changer le password d'un autre utilisateur
  resetPin: async (matricule, newPin, tenantId) => {
    if (!FB_READY || !auth) return false;
    const email = FirebaseAuth.toEmail(matricule, tenantId);
    try {
      // Supprimer l'ancien compte et en recréer un avec le nouveau PIN
      // Note: on ne peut pas supprimer un autre user côté client.
      // On recréé le compte — s'il existe déjà on l'ignore et on force via signIn+updatePassword.
      // Approche: l'admin se reconnecte brièvement avec le nouveau PIN (best-effort).
      // La vraie protection: le PIN est stocké en Firestore chiffré et vérifié au login.
      // Si le compte n'existe pas encore, on le crée avec le nouveau PIN.
      await auth.createUserWithEmailAndPassword(email, newPin).catch(async (e) => {
        if (e.code === 'auth/email-already-in-use') {
          // Compte existant — marquer mustChangePin=true dans Firestore suffit
          // Le SDK Admin serait nécessaire pour forcer le password côté serveur
          console.warn('[KadoLink] Reset PIN Firebase: compte existant, PIN Firestore mis à jour uniquement');
        }
      });
      return true;
    } catch (e) {
      console.warn('FirebaseAuth.resetPin:', e);
      return false;
    }
  },

  // Déconnexion
  signOut: async () => {
    if (!FB_READY || !auth) return;
    try { await auth.signOut(); } catch {}
  },
};

</script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } = React;

// ════════════════════════════════════════════════════════════════
// CONSTANTES
// ════════════════════════════════════════════════════════════════
const BRAND = { primary: '#21396D', secondary: '#35A8E0', accent: '#F7D98D' };
const APP_FOOTER = '© 2026 KadoLink v3.9.2 · Powered by Africa Smart Access (ASA)';

// ════════════════════════════════════════════════════════════════
// PAYMENT CONFIG
// ════════════════════════════════════════════════════════════════
const PAYMENT_CONFIG = {
  cinetpay: {
    apikey:      '14052869565c2b6f692ca27.33945474',
    site_id:     '498340',
    notify_url:  'https://europe-west1-docupme-62abb.cloudfunctions.net/flutterwaveRouter',
    return_url:  window.location.origin + '/?payment=success',
    cancel_url:  window.location.origin + '/?payment=cancel',
    mode:        'PRODUCTION',
  },
  flutterwave: {
    public_key:   'FLWPUBK_TEST-SANDBOXDEMOKEY-X',
    redirect_url: window.location.origin + '/?payment=success',
    secret_hash:  'FLWSECK_TESTda54a70ff842',
  },
};

const PLANS = {
  Free:       { label: 'Free',       emoji: '🆓', price: 0,      maxCards: 50,    maxLots: 2,   maxUsers: 1 },
  Access:     { label: 'Access',     emoji: '🔵', price: 9900,   maxCards: 500,   maxLots: 10,  maxUsers: 3 },
  Regular:    { label: 'Regular',    emoji: '⭐', price: 24900,  maxCards: 2000,  maxLots: 30,  maxUsers: 10 },
  Pro:        { label: 'Pro',        emoji: '🚀', price: 49900,  maxCards: 10000, maxLots: 100, maxUsers: 25 },
  Enterprise: { label: 'Enterprise', emoji: '🏆', price: null,   maxCards: null,  maxLots: null, maxUsers: null },
};

// ════════════════════════════════════════════════════════════════
// PAYMENT HELPERS
// ════════════════════════════════════════════════════════════════

const makeTxRef = (tenantId, planKey) =>
  `KADOLINK-${tenantId}-${planKey}-${Date.now()}`;

const makeInvoiceId = (tenantId) =>
  `INV-KL-${tenantId}-${Date.now()}`;

const loadCinetPaySDK = () => new Promise((resolve, reject) => {
  if (window.CinetPay) return resolve(window.CinetPay);
  const s = document.createElement('script');
  s.src = 'https://cdn.cinetpay.com/seamless/main.js';
  s.onload = () => resolve(window.CinetPay);
  s.onerror = reject;
  document.head.appendChild(s);
});

const loadFlutterwaveSDK = () => new Promise((resolve, reject) => {
  if (window.FlutterwaveCheckout) return resolve(window.FlutterwaveCheckout);
  const s = document.createElement('script');
  s.src = 'https://checkout.flutterwave.com/v3.js';
  s.onload = () => resolve(window.FlutterwaveCheckout);
  s.onerror = reject;
  document.head.appendChild(s);
});

const initCinetPay = async (opts, onSuccess, onError) => {
  const { tenant, planKey, planPrice, userEmail, userName } = opts;
  try {
    const CinetPay = await loadCinetPaySDK();
    const txRef = makeTxRef(tenant.id, planKey);
    const cfg = PAYMENT_CONFIG.cinetpay;
    CinetPay.setConfig({
      apikey:     cfg.apikey,
      site_id:    cfg.site_id,
      notify_url: cfg.notify_url,
      return_url: cfg.return_url,
      mode:       cfg.mode,
    });
    CinetPay.getCheckout({
      transaction_id: txRef,
      amount:         planPrice,
      currency:       'XOF',
      channels:       'ALL',
      description:    `KadoLink - Plan ${planKey} (mensuel)`,
      customer_email: userEmail || '',
      customer_name:  userName  || tenant.name,
      metadata:       JSON.stringify({ tenantId: tenant.id, planKey }),
    });
    CinetPay.waitResponse(data => {
      if (data.status === 'ACCEPTED') onSuccess({ txRef, planKey, gateway: 'cinetpay' });
      else onError(data.message || 'Paiement refusé');
    });
    CinetPay.onError(err => onError(err.message || 'Erreur CinetPay'));
  } catch (e) { onError(e.message || 'Impossible de charger CinetPay'); }
};

const initFlutterwave = async (opts, onSuccess, onError) => {
  const { tenant, planKey, planPrice, userEmail, userName } = opts;
  try {
    const FlutterwaveCheckout = await loadFlutterwaveSDK();
    const txRef = makeTxRef(tenant.id, planKey);
    FlutterwaveCheckout({
      public_key:      PAYMENT_CONFIG.flutterwave.public_key,
      tx_ref:          txRef,
      amount:          planPrice,
      currency:        'XOF',
      payment_options: 'card,mobilemoney',
      redirect_url:    PAYMENT_CONFIG.flutterwave.redirect_url,
      meta: { tenantId: tenant.id, planKey },
      customer: {
        email: userEmail || `tenant-${tenant.id}@kadolink.app`,
        name:  userName  || tenant.name,
      },
      customizations: {
        title:       'KadoLink',
        description: `Abonnement Plan ${planKey}`,
        logo:        'https://kadolink-b8023.web.app/icons/icon-192.png',
      },
      callback: (response) => {
        if (response.status === 'successful') onSuccess({ txRef, planKey, gateway: 'flutterwave', flwRef: response.transaction_id });
        else onError('Paiement non abouti');
      },
      onclose: () => {},
    });
  } catch (e) { onError(e.message || 'Impossible de charger Flutterwave'); }
};

const activatePlanLocally = (tenantId, planKey, txRef) => {
  const tenants = Storage.gget('tenants') || [];
  const now = new Date();
  const nextMonth = new Date(now);
  nextMonth.setMonth(nextMonth.getMonth() + 1);
  const invoice = {
    id:          makeInvoiceId(tenantId),
    tenantId,
    planKey,
    amount:      PLANS[planKey]?.price || 0,
    currency:    'XOF',
    txRef,
    status:      'paid',
    createdAt:   now.toISOString(),
    periodStart: now.toISOString(),
    periodEnd:   nextMonth.toISOString(),
  };
  const invoices = Storage.gget('invoices') || [];
  invoices.push(invoice);
  Storage.gset('invoices', invoices);
  const updated = tenants.map(t => t.id !== tenantId ? t : {
    ...t,
    plan:            planKey,
    planActivatedAt: now.toISOString(),
    planRenewAt:     nextMonth.toISOString(),
    lastInvoiceId:   invoice.id,
  });
  Storage.gset('tenants', updated);
  return invoice;
};

const checkAndAutoRenew = (tenant) => {
  if (!tenant?.planRenewAt || tenant.plan === 'Free') return;
  const renewAt = new Date(tenant.planRenewAt);
  if (new Date() >= renewAt) {
    const invoices = Storage.gget('invoices') || [];
    if (!invoices.find(i => i.tenantId === tenant.id && i.status === 'pending')) {
      invoices.push({
        id:          makeInvoiceId(tenant.id),
        tenantId:    tenant.id,
        planKey:     tenant.plan,
        amount:      PLANS[tenant.plan]?.price || 0,
        currency:    'XOF',
        txRef:       null,
        status:      'pending',
        createdAt:   new Date().toISOString(),
        periodStart: renewAt.toISOString(),
        periodEnd:   new Date(renewAt.getTime() + 30*86400000).toISOString(),
      });
      Storage.gset('invoices', invoices);
    }
  }
};
const today = () => new Date().toISOString().split('T')[0];

const fmtAmount = (n, currency = 'FCFA') => {
  if (!n && n !== 0) return '—';
  return new Intl.NumberFormat('fr-FR').format(n) + ' ' + currency;
};
const fmtDate = (d) => {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
};
const slugify = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

// ════════════════════════════════════════════════════════════════
// CSV EXPORT UTILS — universel
// ════════════════════════════════════════════════════════════════
const CSVExport = {
  // Échappe une valeur pour CSV (gère virgules, guillemets, retours ligne)
  escape: (val) => {
    if (val === null || val === undefined) return '';
    const str = String(val);
    if (str.includes(',') || str.includes('"') || str.includes('\n')) {
      return `"${str.replace(/"/g, '""')}"`;
    }
    return str;
  },

  // Génère et télécharge un fichier CSV
  download: (rows, filename, headers) => {
    const lines = [];
    if (headers) lines.push(headers.map(CSVExport.escape).join(','));
    for (const row of rows) lines.push(row.map(CSVExport.escape).join(','));
    const BOM = '﻿'; // UTF-8 BOM pour Excel
    const blob = new Blob([BOM + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  },

  // Export stats par lot pour un tenant
  statsByLot: (tenantId, tenantName, currency) => {
    const lots = Storage.get(tenantId, 'lots') || [];
    const cards = Storage.get(tenantId, 'cards') || [];
    const headers = ['Lot', 'Assigné à', 'Créé le', 'Total cartes', 'Actives', 'Utilisées', 'Annulées', 'Expirées', 'Valeur totale', 'Valeur encaissée', 'Devise', '% utilisation'];
    const rows = lots.map(lot => {
      const lc = cards.filter(c => c.lotId === lot.id);
      const active = lc.filter(c => c.status === 'ACTIVE').length;
      const redeemed = lc.filter(c => c.status === 'REDEEMED').length;
      const cancelled = lc.filter(c => c.status === 'CANCELLED').length;
      const expired = lc.filter(c => c.status === 'EXPIRED').length;
      const totalVal = lc.reduce((s, c) => s + (c.amount || 0), 0);
      const redVal = lc.filter(c => c.status === 'REDEEMED').reduce((s, c) => s + (c.amount || 0), 0);
      const pct = lc.length > 0 ? Math.round((redeemed / lc.length) * 100) : 0;
      return [lot.name, lot.assignedName || '', lot.createdAt || '', lc.length, active, redeemed, cancelled, expired, totalVal, redVal, currency || 'FCFA', `${pct}%`];
    });
    CSVExport.download(rows, `KadoLink-Stats-Lots-${tenantName}-${today()}.csv`, headers);
  },

  // Export stats par agent pour un tenant
  statsByAgent: (tenantId, tenantName, currency) => {
    const users = Storage.get(tenantId, 'users') || [];
    const cards = Storage.get(tenantId, 'cards') || [];
    const agents = users.filter(u => u.role === 'agent' || u.role === 'partner');
    const headers = ['Agent', 'Matricule', 'Rôle', 'Total cartes assignées', 'Actives', 'Utilisées', 'Valeur totale', 'Valeur encaissée', 'Devise', '% utilisation'];
    const rows = agents.map(agent => {
      const ac = cards.filter(c => c.assignedTo === agent.id);
      const active = ac.filter(c => c.status === 'ACTIVE').length;
      const redeemed = ac.filter(c => c.status === 'REDEEMED').length;
      const totalVal = ac.reduce((s, c) => s + (c.amount || 0), 0);
      const redVal = ac.filter(c => c.status === 'REDEEMED').reduce((s, c) => s + (c.amount || 0), 0);
      const pct = ac.length > 0 ? Math.round((redeemed / ac.length) * 100) : 0;
      return [agent.name || '', agent.matricule || '', agent.role || '', ac.length, active, redeemed, totalVal, redVal, currency || 'FCFA', `${pct}%`];
    });
    CSVExport.download(rows, `KadoLink-Stats-Agents-${tenantName}-${today()}.csv`, headers);
  },

  // Export toutes les cartes d'un tenant (pour audit)
  allCards: (tenantId, tenantName, currency) => {
    const cards = Storage.get(tenantId, 'cards') || [];
    const headers = ['ID carte', 'Lot', 'Montant', 'Devise', 'Unités', 'Statut', 'Assigné à', 'Créé le', 'Expiré le', 'Utilisé le', 'Utilisé par'];
    const rows = cards.map(c => [c.id, c.lotId || '', c.amount || '', currency || 'FCFA', c.units || '', c.status || '', c.assignedTo || '', c.createdAt || '', c.expiresAt || '', c.redeemedAt || '', c.redeemedBy || '']);
    CSVExport.download(rows, `KadoLink-Cartes-${tenantName}-${today()}.csv`, headers);
  },

  // Export global tous tenants (super admin, facturation)
  globalBilling: (tenants) => {
    const headers = ['Tenant', 'URL', 'Plan', 'Total cartes', 'Actives', 'Utilisées', 'Valeur totale', 'Valeur encaissée', 'Devise', '% utilisation', 'Nb agents', 'Créé le', 'Statut'];
    const rows = tenants.map(t => {
      const cards = Storage.get(t.id, 'cards') || [];
      const users = Storage.get(t.id, 'users') || [];
      const active = cards.filter(c => c.status === 'ACTIVE').length;
      const redeemed = cards.filter(c => c.status === 'REDEEMED').length;
      const totalVal = cards.reduce((s, c) => s + (c.amount || 0), 0);
      const redVal = cards.filter(c => c.status === 'REDEEMED').reduce((s, c) => s + (c.amount || 0), 0);
      const agents = users.filter(u => u.role === 'agent' || u.role === 'partner').length;
      const pct = cards.length > 0 ? Math.round((redeemed / cards.length) * 100) : 0;
      return [t.name, t.url || '', t.plan || '', cards.length, active, redeemed, totalVal, redVal, t.currency || 'FCFA', `${pct}%`, agents, t.createdAt || '', t.active ? 'Actif' : 'Suspendu'];
    });
    CSVExport.download(rows, `KadoLink-Facturation-Global-${today()}.csv`, headers);
  },
};

// CRYPTO UTILS
// ════════════════════════════════════════════════════════════════
const Crypto = {
  uid: (len = 6) => {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    return Array.from({length: len}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
  },
  sign: (data, secret) => {
    let h = 0;
    const str = data + secret;
    for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
    return Math.abs(h).toString(36).toUpperCase().padStart(6, '0').slice(0, 6);
  },
  cardId: (tenantId, lotId, idx) => {
    const base = `GIFT-${Crypto.uid(6)}`;
    const sig = Crypto.sign(`${tenantId}:${lotId}:${idx}`, 'kadolink-secret-2026');
    return `${base}-${sig}`;
  },
  matricule: (prefix, idx) => `${prefix.toUpperCase().slice(0,3)}-${String(idx).padStart(4,'0')}`,
};

const LoginPage = ({ onLogin }) => {
  const [form, setForm] = useState({ matricule: '', pin: '' });
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const [showPin, setShowPin] = useState(false);

  const handleLogin = async (e) => {
    e.preventDefault();
    setError('');
    setLoading(true);
    const mat = form.matricule.trim().toUpperCase();
    const pin = form.pin.trim();

    if (!mat || !pin) { setError('Remplissez tous les champs'); setLoading(false); return; }

    // Charger les données depuis Firestore si disponible
    if (FB_READY) {
      await Storage.loadGlobalFromFirestore().catch(() => {});
    }

    let found = null;

    // 1. Super Admin
    const sa = Storage.gget('superadmin');
    if (sa && sa.matricule === mat && sa.pin === pin) {
      found = { ...sa, tenantId: 'global' };
    }

    // 2. Tenant users
    if (!found) {
      const tenants = Storage.gget('tenants') || [];
      for (const t of tenants) {
        // Charger données du tenant depuis Firestore
        if (FB_READY) await Storage.loadFromFirestore(t.id).catch(() => {});
        const users = Storage.get(t.id, 'users') || [];
        const user = users.find(u => u.matricule === mat && u.pin === pin && u.active);
        if (user) {
          found = { ...user, tenantId: t.id, tenantName: t.name, tenant: t };
          break;
        }
      }
    }

    // Si Firebase est prêt et user trouvé dans les données locales → valider aussi via Firebase Auth
    if (found && FB_READY && found.tenantId !== 'global') {
      const fbUser = await FirebaseAuth.signIn(found.matricule, pin, found.tenantId);
      if (fbUser === null) {
        // Compte Firebase inexistant → le créer automatiquement (premier login après migration)
        await FirebaseAuth.createAccount(found.matricule, pin, found.tenantId).catch(() => {});
        // Retenter le signIn
        await FirebaseAuth.signIn(found.matricule, pin, found.tenantId).catch(() => {});
      }
    }

    setLoading(false);

    if (!found) {
      setError('Matricule ou PIN incorrect');

const ChangePinPage = ({ user, onDone, voluntary = false }) => {
  const [form, setForm] = useState({ currentPin: '', newPin: '', confirm: '' });
  const [error, setError] = useState('');
  const [success, setSuccess] = useState(false);
  const [loading, setLoading] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');

    // Vérification PIN actuel si changement volontaire
    if (voluntary && form.currentPin !== user.pin) return setError('PIN actuel incorrect');
    if (form.newPin.length < 4) return setError('PIN minimum 4 caractères');
    if (form.newPin !== form.confirm) return setError('Les PIN ne correspondent pas');
    if (form.newPin === user.pin) return setError('Le nouveau PIN doit être différent de l\'ancien');

    setLoading(true);

    // Mettre à jour dans le storage
    if (user.tenantId === 'global') {
      Storage.gset('superadmin', { ...user, pin: form.newPin, mustChangePin: false });
    } else {
      const users = Storage.get(user.tenantId, 'users') || [];
      const idx = users.findIndex(u => u.id === user.id);
      if (idx > -1) { users[idx] = { ...users[idx], pin: form.newPin, mustChangePin: false }; }
      Storage.set(user.tenantId, 'users', users);
    }

    // Mettre à jour Firebase Auth si disponible
    if (FB_READY && user.tenantId !== 'global') {
      await FirebaseAuth.changePin(user.pin, form.newPin, user.matricule, user.tenantId).catch(() => {});
    }

    setLoading(false);
    setSuccess(true);
    setTimeout(() => onDone({ ...user, pin: form.newPin, mustChangePin: false }), 1200);
  };

  // Vue intégrée dans le profil (voluntary)
  if (voluntary) {
    return (
      <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <h3 className="font-bold text-primary mb-4">🔑 Changer mon PIN</h3>
        {success ? (
          <div className="text-center py-4">
            <div className="text-3xl mb-2">✅</div>
            <div className="text-green-600 font-semibold">PIN mis à jour avec succès !</div>
          </div>
        ) : (
          <>
            {error && <div className="mb-3"><Alert type="error">{error}</Alert></div>}
            <form onSubmit={handleSubmit} className="space-y-3">
              <Input label="PIN actuel" type="password" placeholder="Votre PIN actuel"
                value={form.currentPin} onChange={e => setForm(f => ({...f, currentPin: e.target.value}))} required />
              <Input label="Nouveau PIN" type="password" placeholder="Minimum 4 caractères"
                value={form.newPin} onChange={e => setForm(f => ({...f, newPin: e.target.value}))} required />
              <Input label="Confirmer le nouveau PIN" type="password" placeholder="Répétez le nouveau PIN"
                value={form.confirm} onChange={e => setForm(f => ({...f, confirm: e.target.value}))} required />
              <Btn type="submit" className="w-full" loading={loading}>Mettre à jour le PIN</Btn>
            </form>
          </>
        )}
      </div>
    );
  }

  // Vue plein écran (première connexion)
  return (
    <div className="min-h-screen flex items-center justify-center p-4"
      style={{ background: 'linear-gradient(135deg, #21396D 0%, #35A8E0 100%)' }}>
      <div className="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm fade-in">
        <div className="text-center mb-6">
          <div className="text-4xl mb-2">🔐</div>
          <h2 className="text-xl font-bold text-primary">Première connexion</h2>
          <p className="text-gray-500 text-sm mt-1">Veuillez définir votre nouveau PIN / mot de passe</p>
        </div>
        {error && <div className="mb-4"><Alert type="error">{error}</Alert></div>}
        <form onSubmit={handleSubmit} className="space-y-4">
          <Input label="Nouveau PIN / Mot de passe" type="password" placeholder="Minimum 4 caractères"
            value={form.newPin} onChange={e => setForm(f => ({...f, newPin: e.target.value}))} required />
          <Input label="Confirmer" type="password" placeholder="Répétez le PIN"
            value={form.confirm} onChange={e => setForm(f => ({...f, confirm: e.target.value}))} required />
          <Btn type="submit" size="lg" className="w-full" loading={loading}>Valider et continuer</Btn>
        </form>
      </div>
    </div>
  );
};

// ─── Notifications v3.9 ─────────────────────────────────────────
const useNotifications = (user) => {
  const [notifs, setNotifs] = React.useState([]);
  React.useEffect(() => {
    if (!user?.tenantId) return;
    const cards = Storage.get(user.tenantId, 'cards') || [];
    const lots  = Storage.get(user.tenantId, 'lots')  || [];
    const now = new Date(), in7 = new Date(now.getTime()+7*24*3600*1000);
    const list = [];
    const exp = cards.filter(c => c.status === 'EXPIRED');
    if (exp.length) list.push({ id:'exp', type:'warn', icon:'⏰', msg:`${exp.length} carte${exp.length>1?'s':''} expirée${exp.length>1?'s':''}` });
    lots.filter(l=>l.expiresAt&&new Date(l.expiresAt)>now&&new Date(l.expiresAt)<=in7)
        .forEach(l=>list.push({ id:`lot-${l.id}`, type:'orange', icon:'\U0001f514', msg:`Lot "${l.name}" expire dans <7j` }));
    const active = cards.filter(c=>c.status==='ACTIVE').length;
    if (active<10&&cards.length>0) list.push({ id:'stock', type:'red', icon:'\U0001f534', msg:`Stock bas : ${active} carte${active>1?'s':''} active${active>1?'s':''}` });
    setNotifs(list);
  }, [user?.tenantId]);
  return notifs;
};
const NotifBell = ({ user }) => {
  const notifs = useNotifications(user);
  const [open, setOpen] = React.useState(false);
  const count = notifs.length;
  return (
    <div className="relative">
      <button onClick={() => setOpen(o=>!o)}
        className="relative w-9 h-9 rounded-xl flex items-center justify-center hover:bg-gray-100 active:scale-95" title="Notifications">
        <span className="text-lg">\U0001f514</span>
        {count>0&&<span className="absolute -top-1 -right-1 min-w-[18px] h-[18px] rounded-full flex items-center justify-center text-white font-black animate-pulse"
          style={{background:'#E53E3E',fontSize:10,padding:'0 3px'}}>{count}</span>}
      </button>
      {open&&(
        <div className="absolute right-0 top-11 z-50 w-72 bg-white rounded-2xl shadow-2xl border border-gray-100 overflow-hidden">
          <div className="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
            <span className="font-bold text-primary text-sm">Notifications</span>
            <span className="text-xs text-gray-400">{count} alerte{count>1?'s':''}</span>
          </div>
          {count===0?(<div className="px-4 py-6 text-center text-sm text-gray-400"><div className="text-2xl mb-1">✅</div>Tout est en ordre</div>):(
            <div className="divide-y divide-gray-50 max-h-64 overflow-y-auto">
              {notifs.map(n=>(<div key={n.id} className={`px-4 py-3 flex items-start gap-3 text-sm ${n.type==='red'?'bg-red-50':n.type==='orange'?'bg-orange-50':'bg-amber-50'}`}>
                <span className="text-lg flex-shrink-0">{n.icon}</span>
                <span className={n.type==='red'?'text-red-700':n.type==='orange'?'text-orange-700':'text-amber-700'}>{n.msg}</span>
              </div>))}
            </div>
          )}
          <button onClick={()=>setOpen(false)} className="w-full py-2 text-xs text-gray-400 hover:text-gray-600 border-t border-gray-100">Fermer</button>
        </div>
      )}
      {open&&<div className="fixed inset-0 z-40" onClick={()=>setOpen(false)}/>}
    </div>
  );
};

const SuperAdminDashboard = () => {
  const [tenants, setTenants] = useState(() => Storage.gget('tenants') || []);
  const [activeTab, setActiveTab] = useState('overview');

  useEffect(() => {
    const unsub = Storage.subscribeGlobal('tenants', (val) => { if (val) setTenants(val); });
    return unsub;
  }, []);

  // Calculs consolidés
  const tenantsData = useMemo(() => tenants.map(t => {
    const cards = Storage.get(t.id, 'cards') || [];
    const lots = Storage.get(t.id, 'lots') || [];
    const users = Storage.get(t.id, 'users') || [];
    const active = cards.filter(c => c.status === 'ACTIVE').length;
    const redeemed = cards.filter(c => c.status === 'REDEEMED').length;
    const expired = cards.filter(c => c.status === 'EXPIRED').length;
    const totalVal = cards.reduce((s, c) => s + (c.amount || 0), 0);
    const redVal = cards.filter(c => c.status === 'REDEEMED').reduce((s, c) => s + (c.amount || 0), 0);
    const pct = cards.length > 0 ? Math.round((redeemed / cards.length) * 100) : 0;
    const plan = PLANS[t.plan] || PLANS['Free'];
    return { ...t, cards, lots, users, active, redeemed, expired, totalVal, redVal, pct, plan };
  }), [tenants]);

  const totalCards = tenantsData.reduce((s, t) => s + t.cards.length, 0);
  const totalActive = tenantsData.reduce((s, t) => s + t.active, 0);
  const totalRedeemed = tenantsData.reduce((s, t) => s + t.redeemed, 0);
  const totalVal = tenantsData.reduce((s, t) => s + t.totalVal, 0);
  const totalRedVal = tenantsData.reduce((s, t) => s + t.redVal, 0);
  const globalPct = totalCards > 0 ? Math.round((totalRedeemed / totalCards) * 100) : 0;

  // Répartition par plan
  const planStats = useMemo(() => {
    const counts = {};
    for (const t of tenantsData) {
      const p = t.plan?.label || 'Free';
      counts[p] = (counts[p] || 0) + 1;
    }
    return Object.entries(counts).sort((a, b) => b[1] - a[1]);
  }, [tenantsData]);

  // Top tenants par activité
  const topTenants = useMemo(() =>
    [...tenantsData].sort((a, b) => b.redeemed - a.redeemed).slice(0, 5),
    [tenantsData]);

  // Alertes
  const alerts = useMemo(() => {
    const a = [];
    tenantsData.forEach(t => {
      if (t.active === false) a.push({ type: 'inactive', msg: `${t.name} — compte désactivé`, icon: '⚠️' });
      if (t.expired > 0) a.push({ type: 'expired', msg: `${t.name} — ${t.expired} carte(s) expirée(s)`, icon: '⏰' });
      const plan = t.plan;
      if (plan && plan.maxCards !== Infinity && t.cards.length >= plan.maxCards * 0.9)
        a.push({ type: 'limit', msg: `${t.name} — proche limite cartes (${t.cards.length}/${plan.maxCards})`, icon: '📊' });
    });
    return a.slice(0, 5);
  }, [tenantsData]);

  const tabs = [
    { id: 'overview', label: "📊 Vue d'ensemble" },
    { id: 'tenants', label: '🏢 Tenants' },
    { id: 'activity', label: '📈 Activité' },
    { id: 'alerts', label: `🔔 Alertes${alerts.length > 0 ? ` (${alerts.length})` : ''}` },
  ];

  return (
    <div className="p-4 space-y-5 fade-in">
      {/* Header */}
      <div className="bg-gradient-to-r from-primary to-secondary rounded-2xl p-5 text-white">
        <div className="text-sm opacity-80">👑 Super Administration</div>
        <div className="text-2xl font-black mt-1">KadoLink Platform</div>
        <div className="flex items-center gap-3 mt-2">
          <span className="text-sm opacity-70">{tenantsData.filter(t => t.active !== false).length} tenants actifs</span>
          {FB_READY && <span className="text-xs opacity-50">🔥 Firestore</span>}
        </div>
      </div>

      {/* Tabs */}
      <div className="flex gap-1 bg-gray-100 rounded-xl p-1">
        {tabs.map(tab => (
          <button key={tab.id}
            onClick={() => setActiveTab(tab.id)}
            className={`flex-1 text-xs font-semibold py-2 rounded-lg transition ${activeTab === tab.id ? 'bg-white text-primary shadow-sm' : 'text-gray-500'}`}>
            {tab.label}
          </button>
        ))}
      </div>

      {/* TAB: Vue d'ensemble */}
      {activeTab === 'overview' && (
        <div className="space-y-4">
          {/* KPIs globaux */}
          <div className="grid grid-cols-2 gap-3">
            <StatCard label="Tenants" value={tenantsData.length} icon="🏢" />
            <StatCard label="Total cartes" value={totalCards} icon="🎁" color="secondary" />
            <StatCard label="Actives" value={totalActive} icon="✅" />
            <StatCard label="Utilisées" value={totalRedeemed} icon="✔️" color="secondary" />
          </div>

          {/* Taux global */}

          <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
            <h3 className="font-bold text-primary mb-3">📋 Répartition par plan</h3>
            <div className="space-y-2">
              {planStats.map(([planLabel, count]) => {
                const planInfo = Object.values(PLANS).find(p => p.label === planLabel) || PLANS['Free'];
                const pct = tenantsData.length > 0 ? Math.round((count / tenantsData.length) * 100) : 0;

                    <div className="flex-1">
                      <div className="flex justify-between text-xs mb-1">
                        <span className="font-semibold text-gray-700">{planLabel}</span>
                        <span className="text-gray-500">{count} tenant{count > 1 ? 's' : ''} · {pct}%</span>
                      </div>
                      <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
                        <div className="h-full bg-secondary rounded-full" style={{ width: `${pct}%` }} />
                      </div>
                    </div>
                  </div>
                );
              })}

          </div>

          {/* Top 5 tenants */}
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
            <h3 className="font-bold text-primary mb-3">🏆 Top tenants (par activité)</h3>
            <div className="space-y-2">
              {topTenants.map((t, i) => (
                <div key={t.id} className="flex items-center gap-3 py-1">
                  <span className="text-lg font-black text-gray-300 w-5">{i + 1}</span>
                  <span className="text-xl">{t.logo}</span>
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-semibold text-gray-800 truncate">{t.name}</div>
                    <div className="text-xs text-gray-400">{t.redeemed} utilisées · {t.pct}% taux</div>
                  </div>
                  <span className="text-xs font-bold text-secondary">{t.plan?.emoji} {t.plan?.label}</span>
                </div>
              ))}
              {topTenants.length === 0 && <div className="text-sm text-gray-400 text-center py-2">Aucune activité enregistrée</div>}
            </div>
          </div>
        </div>
      )}

      {/* TAB: Tenants */}
      {activeTab === 'tenants' && (
        <div className="space-y-3">
          {tenantsData.map(t => (
            <div key={t.id} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
              <div className="flex items-start gap-3 mb-3">
                <span className="text-2xl">{t.logo}</span>
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-gray-800 truncate">{t.name}</div>
                  <div className="text-xs text-gray-400">{t.url}</div>
                  <div className="flex items-center gap-2 mt-1">
                    <Badge status={t.active !== false ? 'active' : 'inactive'} />
                    <span className="text-xs font-bold">{t.plan?.emoji} {t.plan?.label}</span>
                  </div>
                </div>
              </div>
              <div className="grid grid-cols-3 gap-2 text-center">
                <div className="bg-gray-50 rounded-lg p-2">
                  <div className="text-sm font-black text-primary">{t.cards.length}</div>
                  <div className="text-xs text-gray-400">cartes</div>
                </div>
                <div className="bg-gray-50 rounded-lg p-2">
                  <div className="text-sm font-black text-green-600">{t.redeemed}</div>
                  <div className="text-xs text-gray-400">utilisées</div>
                </div>
                <div className="bg-gray-50 rounded-lg p-2">
                  <div className="text-sm font-black text-secondary">{t.pct}%</div>
                  <div className="text-xs text-gray-400">taux</div>
                </div>
              </div>
            </div>
          ))}
          {tenantsData.length === 0 && (
            <div className="text-center py-8 text-gray-400">
              <div className="text-4xl mb-2">🏢</div>
              <div className="text-sm">Aucun tenant créé</div>
            </div>
          )}
        </div>
      )}

      {/* TAB: Activité v3.9 */}
      {activeTab === 'activity' && (
        <div className="space-y-4">
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
            <h3 className="font-bold text-primary mb-4">📊 Cartes par tenant (utilisées / actives)</h3>
            {tenantsData.length===0?(<div className="text-sm text-gray-400 text-center py-4">Aucun tenant</div>):(
              <div className="space-y-3">
                {[...tenantsData].sort((a,b)=>b.cards.length-a.cards.length).map(t=>{
                  const mx=Math.max(...tenantsData.map(x=>x.cards.length),1);
                  const wA=Math.round((t.active/mx)*100); const wR=Math.round((t.redeemed/mx)*100);
                  return (<div key={t.id}>
                    <div className="flex justify-between text-xs mb-1">
                      <span className="font-semibold text-gray-700">{t.logo} {t.name}</span>
                      <span className="text-gray-400">{t.redeemed}/{t.cards.length} · {t.pct}%</span>
                    </div>
                    <div className="h-5 bg-gray-100 rounded-full overflow-hidden flex">
                      <div className="h-full rounded-full" style={{width:`${wR}%`,background:'#35A8E0'}}/>
                      <div className="h-full" style={{width:`${Math.max(0,wA-wR)}%`,background:'#E0EDFA'}}/>

                <div className="flex gap-4 text-xs text-gray-500 mt-2">
                  <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded-full bg-secondary"></span>Utilisées</span>
                  <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded-full bg-blue-100"></span>Actives</span>

// DASHBOARD — ADMIN TENANT
// ════════════════════════════════════════════════════════════════
const AdminDashboard = ({ user }) => {
  const { tenant } = useApp();
  const [cards, setCards] = useState(() => Storage.get(user.tenantId, 'cards') || []);
  const [lots, setLots] = useState(() => Storage.get(user.tenantId, 'lots') || []);
  const [users, setUsers] = useState(() => Storage.get(user.tenantId, 'users') || []);

  // Abonnements temps-réel Firestore
  useEffect(() => {
    const unsubCards = Storage.subscribe(user.tenantId, 'cards', (val) => { if (val) setCards(val); });
    const unsubLots = Storage.subscribe(user.tenantId, 'lots', (val) => { if (val) setLots(val); });
    const unsubUsers = Storage.subscribe(user.tenantId, 'users', (val) => { if (val) setUsers(val); });
    return () => { unsubCards(); unsubLots(); unsubUsers(); };
  }, [user.tenantId]);

  // ── Expiration automatique v3.7 ─────────────────────────────────────────
  // Vérifie toutes les cartes ACTIVE au chargement et les passe EXPIRED si dépassées
  useEffect(() => {
    const now = new Date();
    const allCards = Storage.get(user.tenantId, 'cards') || [];
    const toExpire = allCards.filter(c =>
      c.status === 'ACTIVE' && c.expiresAt && new Date(c.expiresAt) < now
    );
    if (toExpire.length === 0) return;
    const updated = allCards.map(c =>
      c.status === 'ACTIVE' && c.expiresAt && new Date(c.expiresAt) < now
        ? { ...c, status: 'EXPIRED', expiredAt: now.toISOString() }
        : c
    );
    Storage.set(user.tenantId, 'cards', updated);
    setCards(updated);
    console.log(`[KadoLink v3.9.1] ${toExpire.length} carte(s) expirée(s) automatiquement`);
  }, [user.tenantId]);

  const stats = useMemo(() => ({
    total: cards.length,
    active: cards.filter(c => c.status === 'ACTIVE').length,
    redeemed: cards.filter(c => c.status === 'REDEEMED').length,
    expired: cards.filter(c => c.status === 'EXPIRED').length,
    cancelled: cards.filter(c => c.status === 'CANCELLED').length,
    totalValue: cards.reduce((s, c) => s + c.amount, 0),
    redeemedValue: cards.filter(c => c.status === 'REDEEMED').reduce((s, c) => s + c.amount, 0),
  }), [cards]);

  const alertThreshold = tenant?.alertThreshold || 100;
  const stockAlert = stats.active < alertThreshold;
  const stockCritical = stats.active === 0 && stats.total > 0;

  // ── Alertes expiration v3.7 ──────────────────────────────────────────────
  const expiryAlerts = useMemo(() => {
    const now = new Date();
    const in7 = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
    // Lots qui expirent dans 7 jours (avec cartes actives)
    const lotsExpiringSoon = lots.filter(lot => {
      if (!lot.expiresAt) return false;
      const expDate = new Date(lot.expiresAt);
      const lotActive = cards.filter(c => c.lotId === lot.id && c.status === 'ACTIVE').length;
      return expDate > now && expDate <= in7 && lotActive > 0;
    });
    // Cartes individuelles qui expirent dans 7 jours
    const cardsExpiringSoon = cards.filter(c =>
      c.status === 'ACTIVE' && c.expiresAt &&
      new Date(c.expiresAt) > now && new Date(c.expiresAt) <= in7
    );
    // Cartes déjà expirées mais pas encore traitées
    const cardsExpiredPending = cards.filter(c =>
      c.status === 'EXPIRED'
    );
    return { lotsExpiringSoon, cardsExpiringSoon, cardsExpiredPending };
  }, [lots, cards]);

  // Lots avec stock bas
  const lotsLow = lots.filter(lot => {
    const lotCards = cards.filter(c => c.lotId === lot.id);
    const active = lotCards.filter(c => c.status === 'ACTIVE').length;
    const total = lotCards.length;
    const lotThreshold = lot.alertThreshold || Math.max(5, Math.floor(total * 0.2));
    return active <= lotThreshold && total > 0;
  });

  return (
    <div className="p-4 space-y-5 fade-in">
      <div className="bg-gradient-to-r from-primary to-secondary rounded-2xl p-5 text-white">
        <div className="text-sm opacity-80">Admin · {tenant?.name}</div>
        <div className="text-xl font-black mt-1">Tableau de bord</div>
        <div className="text-sm opacity-70 mt-1">{today()}</div>
      </div>

      {stockCritical && (
        <div className="bg-red-50 border border-red-300 rounded-xl p-3 flex items-start gap-2">
          <span className="text-red-500 text-lg mt-0.5 animate-pulse">🔴</span>
          <div>
            <div className="font-semibold text-red-700 text-sm">Stock épuisé !</div>
            <div className="text-xs text-red-600 mt-0.5">Aucune carte active disponible. Créez un nouveau lot immédiatement.</div>
          </div>
        </div>
      )}
      {!stockCritical && stockAlert && (
        <div className="bg-amber-50 border border-amber-300 rounded-xl p-3 flex items-start gap-2">
          <span className="text-amber-500 text-lg mt-0.5">⚠️</span>
          <div>
            <div className="font-semibold text-amber-700 text-sm">Stock bas</div>
            <div className="text-xs text-amber-700 mt-0.5">
              <strong>{stats.active}</strong> cartes actives — seuil configuré : {alertThreshold}
              {lotsLow.length > 0 && <span className="ml-1">· {lotsLow.length} lot{lotsLow.length > 1 ? 's' : ''} concerné{lotsLow.length > 1 ? 's' : ''}</span>}
            </div>
          </div>
        </div>
      )}

      {/* ── Alertes expiration v3.7 ─────────────────────────────────── */}
      {expiryAlerts.cardsExpiredPending.length > 0 && (
        <div className="bg-gray-50 border border-gray-300 rounded-xl p-3 flex items-start gap-2">
          <span className="text-gray-500 text-lg mt-0.5">⏰</span>
          <div>
            <div className="font-semibold text-gray-700 text-sm">
              {expiryAlerts.cardsExpiredPending.length} carte{expiryAlerts.cardsExpiredPending.length > 1 ? 's' : ''} expirée{expiryAlerts.cardsExpiredPending.length > 1 ? 's' : ''}
            </div>
            <div className="text-xs text-gray-500 mt-0.5">Ces cartes ont été désactivées automatiquement</div>
          </div>
        </div>
      )}
      {expiryAlerts.lotsExpiringSoon.length > 0 && (
        <div className="bg-orange-50 border border-orange-300 rounded-xl p-3 flex items-start gap-2">
          <span className="text-orange-500 text-lg mt-0.5 animate-pulse">🔔</span>
          <div>
            <div className="font-semibold text-orange-700 text-sm">
              Lot{expiryAlerts.lotsExpiringSoon.length > 1 ? 's' : ''} expirant dans 7 jours
            </div>
            {expiryAlerts.lotsExpiringSoon.map(lot => (
              <div key={lot.id} className="text-xs text-orange-600 mt-0.5">
                📦 <strong>{lot.name}</strong> — expire le {fmtDate(lot.expiresAt)}
                {' · '}{cards.filter(c => c.lotId === lot.id && c.status === 'ACTIVE').length} cartes actives
              </div>
            ))}
          </div>
        </div>
      )}
      {expiryAlerts.cardsExpiringSoon.length > 0 && expiryAlerts.lotsExpiringSoon.length === 0 && (
        <div className="bg-orange-50 border border-orange-300 rounded-xl p-3 flex items-start gap-2">
          <span className="text-orange-500 text-lg mt-0.5">⏳</span>
          <div>
            <div className="font-semibold text-orange-700 text-sm">
              {expiryAlerts.cardsExpiringSoon.length} carte{expiryAlerts.cardsExpiringSoon.length > 1 ? 's' : ''} expirant dans 7 jours
            </div>
            <div className="text-xs text-orange-600 mt-0.5">Vérifiez les lots concernés dans la page Cartes</div>
          </div>
        </div>
      )}

      <div className="grid grid-cols-2 gap-3">
        <StatCard label="Cartes actives" value={stats.active} icon="🟢" />
        <StatCard label="Utilisées" value={stats.redeemed} icon="✔️" color="secondary" />
        <StatCard label="Total lots" value={lots.length} icon="📦" />
        <StatCard label="Équipe" value={users.length} icon="👥" />
      </div>

      <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <h3 className="font-bold text-primary mb-3">Valeurs générées</h3>
        <div className="space-y-2">
          <div className="flex justify-between text-sm">
            <span className="text-gray-600">Total émis</span>
            <span className="font-semibold">{fmtAmount(stats.totalValue, tenant?.currency)}</span>
          </div>
          <div className="flex justify-between text-sm">
            <span className="text-gray-600">Total encaissé</span>
            <span className="font-semibold text-green-600">{fmtAmount(stats.redeemedValue, tenant?.currency)}</span>
          </div>
          <div className="flex justify-between text-sm">
            <span className="text-gray-600">En circulation</span>
            <span className="font-semibold text-secondary">{fmtAmount(stats.totalValue - stats.redeemedValue, tenant?.currency)}</span>
          </div>
        </div>
      </div>

      {stats.total>0&&(
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <h3 className="font-bold text-primary mb-3">📊 Répartition des cartes</h3>
          <div className="space-y-2">
            {[{label:'Actives',count:stats.active,color:'#22C55E'},{label:'Utilisées',count:stats.redeemed,color:'#35A8E0'},{label:'Expirées',count:stats.expired,color:'#9CA3AF'},{label:'Annulées',count:stats.cancelled,color:'#EF4444'}]
              .filter(r=>r.count>0).map(row=>{
                const pct=stats.total>0?Math.round((row.count/stats.total)*100):0;
                return (<div key={row.label} className="flex items-center gap-3">
                  <span className="w-20 text-xs text-gray-600">{row.label}</span>
                  <div className="flex-1 h-5 bg-gray-100 rounded-full overflow-hidden">
                    <div className="h-full rounded-full transition-all" style={{width:`${pct}%`,background:row.color}}/>
                  </div>
                  <span className="w-10 text-right text-xs font-bold text-gray-700">{pct}%</span>
                  <span className="w-6 text-right text-xs text-gray-400">{row.count}</span>
                </div>);
              })}
          </div>
        </div>
      )}

      <div>
        <h3 className="font-bold text-primary mb-3">Lots récents</h3>
        {lots.slice(-3).reverse().map(lot => (
          <div key={lot.id} className="bg-white rounded-xl p-3 shadow-sm border border-gray-100 mb-2">
            <div className="flex items-center justify-between">
              <div>
                <div className="font-semibold text-sm">{lot.name}</div>
                <div className="text-xs text-gray-400">{lot.assignedName} · {fmtDate(lot.createdAt)}</div>
              </div>
              <Badge status={lot.status} />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
};

// DASHBOARD — AGENT / PARTENAIRE
// ════════════════════════════════════════════════════════════════
// ─── KioskPage v3.8 ─────────────────────────────────────────────
const KioskPage = ({ user, setPage }) => {
  const { tenant } = useApp();
  const [cards, setCards] = useState(() => Storage.get(user.tenantId, 'cards') || []);
  const [lots, setLots] = useState(() => Storage.get(user.tenantId, 'lots') || []);
  const [currentIdx, setCurrentIdx] = useState(0);
  const [now, setNow] = useState(new Date());
  const intervalRef = useRef(null);
  const clockRef = useRef(null);

  // Abonnements temps-réel
  useEffect(() => {
    const u1 = Storage.subscribe(user.tenantId, 'cards', v => { if (v) setCards(v); });
    const u2 = Storage.subscribe(user.tenantId, 'lots', v => { if (v) setLots(v); });
    return () => { u1(); u2(); };
  }, [user.tenantId]);

  // Horloge 1 s
  useEffect(() => {
    clockRef.current = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(clockRef.current);
  }, []);

  // Cartes actives affichables par ce partenaire
  const activeCards = useMemo(() => {
    return cards.filter(c => {
      if (c.status !== 'ACTIVE') return false;
      if (c.expiresAt && new Date(c.expiresAt) < now) return false;
      return true;
    });
  }, [cards, now]);

  // Rotation automatique toutes les 8 secondes
  useEffect(() => {
    if (activeCards.length <= 1) return;
    intervalRef.current = setInterval(() => {
      setCurrentIdx(i => (i + 1) % activeCards.length);
    }, 8000);
    return () => clearInterval(intervalRef.current);
  }, [activeCards.length]);

  // Reset index si hors-limites
  useEffect(() => {
    if (currentIdx >= activeCards.length && activeCards.length > 0) setCurrentIdx(0);
  }, [activeCards.length, currentIdx]);

  const card = activeCards[currentIdx] || null;
  const lot = card ? (lots.find(l => l.id === card.lotId) || null) : null;

  const timeStr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const dateStr = now.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  // QR code simple via API publique (data URI fallback si offline)
  const qrUrl = card
    ? `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(card.id)}&bgcolor=111827&color=F7D98D&margin=8`
    : null;

  return (
    <div
      className="fixed inset-0 z-50 flex flex-col bg-gray-900 text-white select-none overflow-hidden"
      style={{ fontFamily: "'Inter', sans-serif" }}
    >
      {/* ── Header ──────────────────────────────────────────── */}
      <div className="flex items-center justify-between px-8 py-4 border-b border-gray-700/60">
        <div className="flex items-center gap-3">
          <div className="w-9 h-9 rounded-xl flex items-center justify-center text-xl"
            style={{ background: '#21396D' }}>🎁</div>
          <div>
            <div className="text-base font-bold tracking-wide" style={{ color: '#F7D98D' }}>KadoLink</div>
            <div className="text-xs text-gray-400">{user.name || 'Partenaire'}</div>
          </div>
        </div>
        <div className="text-right">
          <div className="text-2xl font-bold tabular-nums" style={{ color: '#35A8E0' }}>{timeStr}</div>
          <div className="text-xs text-gray-400 capitalize">{dateStr}</div>

const AgentDashboard = ({ user, setPage }) => {
  const { tenant } = useApp();
  const [allCards, setAllCards] = useState(() => Storage.get(user.tenantId, 'cards') || []);
  const [lots, setLots] = useState(() => Storage.get(user.tenantId, 'lots') || []);
  const [allUsers, setAllUsers] = useState(() => Storage.get(user.tenantId, 'users') || []);

  useEffect(() => {
    const u1 = Storage.subscribe(user.tenantId, 'cards', v => { if (v) setAllCards(v); });
    const u2 = Storage.subscribe(user.tenantId, 'lots', v => { if (v) setLots(v); });
    const u3 = Storage.subscribe(user.tenantId, 'users', v => { if (v) setAllUsers(v); });
    return () => { u1(); u2(); u3(); };
  }, [user.tenantId]);

  const isPartner = user.role === 'partner';
  const myCards = allCards.filter(c => isPartner ? true : c.assignedTo === user.id);

  // Dates
  const now = new Date();
  const todayStr = now.toISOString().slice(0, 10);
  const nowYM = now.toISOString().slice(0, 7);
  const monthNames = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
  const monthLabel = monthNames[now.getMonth()] + ' ' + now.getFullYear();

  // Stats générales
  const stats = {
    total: myCards.length,
    active: myCards.filter(c => c.status === 'ACTIVE').length,
    redeemed: myCards.filter(c => c.status === 'REDEEMED').length,
  };

  // Scans du jour
  const todayScans = myCards.filter(c =>
    c.status === 'REDEEMED' && c.redeemedAt && c.redeemedAt.slice(0,10) === todayStr
  );
  const todayCA = todayScans.reduce((s, c) => s + (c.amount || 0), 0);

  // Mois en cours
  const redeemedThisMonth = myCards.filter(c =>
    c.status === 'REDEEMED' && c.redeemedAt && c.redeemedAt.slice(0,7) === nowYM
  );
  const caThisMonth = redeemedThisMonth.reduce((s, c) => s + (c.amount || 0), 0);

  // Objectif mensuel
  const monthlyGoal = tenant?.agentMonthlyGoal || 20;
  const goalPct = Math.min(100, Math.round((redeemedThisMonth.length / monthlyGoal) * 100));
  const goalColor = goalPct >= 100 ? 'bg-green-500' : goalPct >= 60 ? 'bg-secondary' : 'bg-accent';

  // Lots assignés
  const myLots = lots.filter(l => l.assignedTo === user.id);
  const activeLot = myLots.find(l => l.status === 'active');

  // Classement agents (ce mois)
  const agents = allUsers.filter(u => u.role === 'agent' || u.role === 'partner');
  const ranking = agents.map(a => {
    const aCards = allCards.filter(c => c.assignedTo === a.id);
    const aMonth = aCards.filter(c => c.status === 'REDEEMED' && c.redeemedAt?.slice(0,7) === nowYM);
    return { id: a.id, name: a.name, count: aMonth.length, ca: aMonth.reduce((s,c) => s+(c.amount||0), 0) };
  }).sort((a, b) => b.count - a.count);
  const myRank = ranking.findIndex(r => r.id === user.id) + 1;

  // 5 dernières utilisations
  const recentRedeemed = [...myCards]
    .filter(c => c.status === 'REDEEMED' && c.redeemedAt)
    .sort((a, b) => (b.redeemedAt || '').localeCompare(a.redeemedAt || ''))
    .slice(0, 5);

  // Taux de conversion
  const convRate = stats.total > 0 ? Math.round((stats.redeemed / stats.total) * 100) : 0;

  return (
    <div className="p-4 space-y-4 fade-in">

      {/* Header */}
      <div className="bg-gradient-to-r from-primary to-secondary rounded-2xl p-5 text-white">
        <div className="text-sm opacity-80">👋 Bonjour, {user.name.split(' ')[0]}</div>
        <div className="text-xl font-black mt-1">{isPartner ? 'Espace Partenaire' : 'Mon tableau de bord'}</div>
        <div className="text-sm opacity-70">{tenant?.name}</div>
        {activeLot && (
          <div className="mt-3 bg-white bg-opacity-20 rounded-xl px-3 py-2 text-xs">
            📦 Lot actif : <span className="font-bold">{activeLot.name}</span>
            {activeLot.expiresAt && <span className="opacity-80"> · expire le {activeLot.expiresAt}</span>}
          </div>
        )}
      </div>

      {/* Scans du jour — highlight */}
      <div className="bg-white rounded-2xl p-4 shadow-sm border-2 border-secondary/30">
        <div className="flex justify-between items-center">
          <div>
            <div className="text-xs text-gray-500 font-medium">📅 Aujourd'hui</div>
            <div className="text-3xl font-black text-secondary mt-0.5">{todayScans.length}</div>
            <div className="text-xs text-gray-400">scan{todayScans.length > 1 ? 's' : ''} · {fmtAmount(todayCA)}</div>
          </div>
          <div className="text-right">
            <div className="text-xs text-gray-500 font-medium">🗓️ Ce mois</div>
            <div className="text-3xl font-black text-primary mt-0.5">{redeemedThisMonth.length}</div>
            <div className="text-xs text-gray-400">{fmtAmount(caThisMonth)}</div>
          </div>
          {setPage && (
            <button
              onClick={() => setPage('scanner')}
              className="bg-secondary text-white rounded-2xl px-4 py-3 text-sm font-black shadow-md active:scale-95 transition">
              📷<br/>Scanner
            </button>
          )}
        </div>
        {todayScans.length > 0 && (
          <div className="mt-3 pt-3 border-t border-gray-100 space-y-1">
            {todayScans.slice(0,3).map(c => (
              <div key={c.id} className="flex justify-between text-xs text-gray-600">
                <span className="font-mono">{c.code}</span>
                <span className="text-green-600 font-semibold">{fmtAmount(c.amount)}</span>
              </div>
            ))}
            {todayScans.length > 3 && <div className="text-xs text-gray-400 text-center">+{todayScans.length - 3} autre{todayScans.length - 3 > 1 ? 's' : ''}</div>}
          </div>
        )}
      </div>

      {/* Stats rapides */}
      <div className="grid grid-cols-3 gap-3">
        <StatCard label="Assignées" value={stats.total} icon="🎁" />
        <StatCard label="Actives" value={stats.active} icon="🟢" />
        <StatCard label="Utilisées" value={stats.redeemed} icon="✔️" color="secondary" />
      </div>

      {/* Objectif du mois */}
      <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <div className="flex justify-between items-center mb-3">
          <div>
            <div className="font-bold text-primary text-sm">🎯 Objectif {monthLabel}</div>
            <div className="text-xs text-gray-500">{redeemedThisMonth.length} / {monthlyGoal} cartes</div>
          </div>
          <div className={`text-lg font-black ${goalPct >= 100 ? 'text-green-600' : 'text-primary'}`}>{goalPct}%</div>
        </div>
        <div className="w-full bg-gray-100 rounded-full h-3">
          <div className={`${goalColor} h-3 rounded-full transition-all duration-700`} style={{ width: `${goalPct}%` }} />
        </div>
        {goalPct >= 100 && (
          <div className="text-xs text-green-600 font-semibold mt-2 text-center animate-pulse">🏆 Objectif atteint !</div>
        )}
      </div>

      {/* Classement équipe */}
      {ranking.length > 1 && (
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <div className="flex justify-between items-center mb-3">
            <div className="font-bold text-primary text-sm">🏅 Classement équipe — {monthLabel}</div>
            {myRank > 0 && <span className="text-xs bg-primary/10 text-primary px-2 py-1 rounded-full font-bold">#{myRank}</span>}
          </div>
          <div className="space-y-2">
            {ranking.slice(0,5).map((r, idx) => {
              const isMe = r.id === user.id;
              const medals = ['🥇','🥈','🥉','4️⃣','5️⃣'];
              return (
                <div key={r.id} className={`flex items-center gap-3 py-1.5 px-2 rounded-xl text-xs ${isMe ? 'bg-secondary/10 font-bold' : ''}`}>
                  <span className="text-base">{medals[idx] || `${idx+1}.`}</span>
                  <span className={`flex-1 truncate ${isMe ? 'text-secondary' : 'text-gray-700'}`}>{r.name}{isMe ? ' (moi)' : ''}</span>
                  <span className="font-semibold text-gray-800">{r.count} 🎁</span>
                  <span className="text-gray-400">{fmtAmount(r.ca)}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* CA + taux conversion */}
      <div className="grid grid-cols-2 gap-3">
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center">
          <div className="text-xs text-gray-500 mb-1">📈 Taux conv.</div>
          <div className="font-black text-secondary text-2xl">{convRate}%</div>
          <div className="text-xs text-gray-400">{stats.redeemed}/{stats.total}</div>
        </div>
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center">
          <div className="text-xs text-gray-500 mb-1">💼 Lots actifs</div>
          <div className="font-black text-primary text-2xl">{myLots.filter(l=>l.status==='active').length}</div>
          <div className="text-xs text-gray-400">sur {myLots.length} total</div>
        </div>
      </div>

      {/* Dernières activités */}
      {recentRedeemed.length > 0 && (
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <div className="font-bold text-primary text-sm mb-3">🕐 Dernières utilisations</div>
          <div className="space-y-2">
            {recentRedeemed.map(c => (
              <div key={c.id} className="flex justify-between items-center py-1 border-b border-gray-50 last:border-0">
                <div>
                  <div className="text-xs font-semibold font-mono text-gray-700">{c.code}</div>
                  <div className="text-xs text-gray-400">{c.redeemedAt?.slice(0,10) || '—'}</div>
                </div>
                <Badge color="green">{fmtAmount(c.amount)}</Badge>
              </div>
            ))}
          </div>
        </div>
      )}

      {stats.total === 0 && (
        <div className="text-center text-gray-400 text-sm py-8">
          <div className="text-4xl mb-2">🎁</div>
          Aucune carte ne vous est assignée pour le moment.
        </div>
      )}
    </div>
  );
};
