// STATS PAGE — rapport d'utilisation admin tenant
// ════════════════════════════════════════════════════════════════
const StatsPage = ({ user }) => {
  const { tenant } = useApp();
  const isSuperAdmin = user.role === 'superadmin' && !user.tenantId;
  // Hooks toujours appelés (règle des hooks React — pas de return conditionnel avant les hooks)
  const cards = useMemo(() => !isSuperAdmin ? (Storage.get(user.tenantId, 'cards') || []) : [], [user.tenantId, isSuperAdmin]);
  const lots = useMemo(() => !isSuperAdmin ? (Storage.get(user.tenantId, 'lots') || []) : [], [user.tenantId, isSuperAdmin]);
  const tenantUsers = useMemo(() => !isSuperAdmin ? (Storage.get(user.tenantId, 'users') || []) : [], [user.tenantId, isSuperAdmin]);
  const agents = tenantUsers.filter(u => u.role === 'agent' || u.role === 'partner');
  const currency = tenant?.currency || 'FCFA';

  // Stats globales
  const total = cards.length;
  const active = cards.filter(c => c.status === 'ACTIVE').length;
  const redeemed = cards.filter(c => c.status === 'REDEEMED').length;
  const cancelled = cards.filter(c => c.status === 'CANCELLED').length;
  const totalVal = cards.reduce((s, c) => s + (c.amount || 0), 0);
  const redVal = cards.filter(c => c.status === 'REDEEMED').reduce((s, c) => s + (c.amount || 0), 0);
  const pctUse = total > 0 ? Math.round((redeemed / total) * 100) : 0;

  // Stats par montant
  const byAmount = useMemo(() => {
    const map = {};
    for (const c of cards) {
      if (!map[c.amount]) map[c.amount] = { total: 0, active: 0, redeemed: 0 };
      map[c.amount].total++;
      if (c.status === 'ACTIVE') map[c.amount].active++;
      if (c.status === 'REDEEMED') map[c.amount].redeemed++;
    }
    return Object.entries(map).sort((a, b) => Number(a[0]) - Number(b[0]));
  }, [cards]);

  // Stats par lot
  const byLot = useMemo(() => lots.map(lot => {
    const lc = cards.filter(c => c.lotId === lot.id);
    const a = lc.filter(c => c.status === 'ACTIVE').length;
    const r = lc.filter(c => c.status === 'REDEEMED').length;
    const v = lc.reduce((s, c) => s + (c.amount || 0), 0);
    const rv = lc.filter(c => c.status === 'REDEEMED').reduce((s, c) => s + (c.amount || 0), 0);
    return { ...lot, total: lc.length, active: a, redeemed: r, totalVal: v, redVal: rv, pct: lc.length > 0 ? Math.round((r / lc.length) * 100) : 0 };
  }), [lots, cards]);

  // Stats par agent
  const byAgent = useMemo(() => agents.map(agent => {
    const ac = cards.filter(c => c.assignedTo === agent.id);
    const a = ac.filter(c => c.status === 'ACTIVE').length;
    const r = ac.filter(c => c.status === 'REDEEMED').length;
    const rv = ac.filter(c => c.status === 'REDEEMED').reduce((s, c) => s + (c.amount || 0), 0);
    return { ...agent, total: ac.length, active: a, redeemed: r, redVal: rv, pct: ac.length > 0 ? Math.round((r / ac.length) * 100) : 0 };
  }).sort((a, b) => b.redeemed - a.redeemed), [agents, cards]);

  const tenantName = tenant?.name || user.tenantId || 'Plateforme';
  const plan = getPlan(tenant);

  // Vue superadmin global (après tous les hooks)
  if (isSuperAdmin) {
    const allTenants = Storage.gget('tenants') || [];
    const totalCards = allTenants.reduce((s, t) => s + (Storage.get(t.id, 'cards') || []).length, 0);
    const totalRedeemed = allTenants.reduce((s, t) => { const c = Storage.get(t.id, 'cards') || []; return s + c.filter(x => x.status === 'REDEEMED').length; }, 0);
    return (
      <div className="p-4 space-y-5 fade-in">
        <div className="bg-gradient-to-r from-primary to-secondary rounded-2xl p-5 text-white">
          <div className="text-sm opacity-80">📈 Statistiques · Vue globale</div>
          <div className="text-xl font-black mt-1">Toutes tenants</div>
          <div className="text-sm opacity-70 mt-1">{today()}</div>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <StatCard label="Tenants actifs" value={allTenants.filter(t => t.active !== false).length} icon="🏢" />
          <StatCard label="Total cartes" value={totalCards} icon="🎁" color="secondary" />
          <StatCard label="Encaissées" value={totalRedeemed} icon="✅" />
          <StatCard label="Taux global" value={totalCards > 0 ? `${Math.round((totalRedeemed/totalCards)*100)}%` : '0%'} icon="📊" color="secondary" />
        </div>
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <h3 className="font-bold text-primary mb-3">📥 Export facturation global</h3>
          <button onClick={() => CSVExport.globalBilling(allTenants)}
            className="w-full text-left px-4 py-3 rounded-xl bg-green-50 hover:bg-green-100 transition text-sm flex items-center gap-3">
            <span className="text-xl">🧾</span>
            <div>
              <div className="font-semibold text-primary">Facturation tous tenants</div>
              <div className="text-xs text-gray-500">{allTenants.length} tenant(s) · {totalCards} cartes au total</div>
            </div>
            <span className="ml-auto text-green-600 text-xs font-bold">↓ CSV</span>
          </button>
        </div>
        <div className="bg-amber-50 rounded-2xl p-4 border border-amber-200">
          <div className="text-sm text-amber-800">💡 Pour les stats détaillées par tenant, connectez-vous avec le compte admin du tenant concerné.</div>
        </div>
      </div>
    );
  }

  if (!plan.stats) {
    return (
      <div className="p-4 space-y-5 fade-in">
        <div className="bg-gradient-to-r from-gray-400 to-gray-500 rounded-2xl p-5 text-white">
          <div className="text-sm opacity-80">📈 Statistiques</div>
          <div className="text-xl font-black mt-1">Accès restreint</div>
          <div className="text-sm opacity-70 mt-1">Plan {plan.label}</div>
        </div>
        <div className="bg-amber-50 rounded-2xl p-6 border border-amber-200 text-center space-y-3">
          <div className="text-4xl">📊</div>
          <div className="font-bold text-primary text-lg">Statistiques non incluses</div>
          <div className="text-sm text-gray-600">Les statistiques détaillées sont disponibles à partir du plan <strong>Regular</strong>.</div>
          <div className="mt-2 inline-block bg-primary text-white text-xs font-bold px-4 py-2 rounded-full">🔼 Passer au plan Regular ou supérieur</div>
        </div>
      </div>
    );
  }

  return (
    <div className="p-4 space-y-5 fade-in">
      <div className="bg-gradient-to-r from-primary to-secondary rounded-2xl p-5 text-white">
        <div className="text-sm opacity-80">📈 Statistiques · {tenantName}</div>
        <div className="text-xl font-black mt-1">Rapport d'utilisation</div>
        <div className="text-sm opacity-70 mt-1">{today()}</div>
      </div>

      {/* KPIs globaux */}
      <div className="grid grid-cols-2 gap-3">
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 col-span-2">
          <div className="flex justify-between items-center mb-2">
            <span className="text-sm font-semibold text-gray-700">Taux d'utilisation global</span>
            <span className="text-2xl font-black text-primary">{pctUse}%</span>
          </div>
          <div className="h-3 bg-gray-100 rounded-full overflow-hidden">
            <div className="h-full bg-gradient-to-r from-secondary to-primary rounded-full transition-all"
              style={{ width: `${pctUse}%` }} />
          </div>
          <div className="flex justify-between text-xs text-gray-400 mt-1">
            <span>{redeemed} utilisées</span>
            <span>{active} actives restantes</span>
          </div>
        </div>
        <StatCard label="Total cartes" value={total} icon="🎁" />
        <StatCard label="Encaissées" value={redeemed} icon="✅" color="secondary" />
        <StatCard label="Valeur émise" value={fmtAmount(totalVal, currency)} icon="💰" />
        <StatCard label="Valeur encaissée" value={fmtAmount(redVal, currency)} icon="💵" color="secondary" />
      </div>

      {/* Exports CSV */}
      <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <h3 className="font-bold text-primary mb-3">📥 Exports CSV</h3>
        {!plan.csvExport ? (
          <div className="text-center py-4 space-y-2">
            <div className="text-3xl">🔒</div>
            <div className="text-sm font-semibold text-gray-600">Export CSV non inclus dans le plan <strong>{plan.label}</strong></div>
            <div className="text-xs text-gray-400">Disponible à partir du plan Access</div>
            <div className="mt-2 inline-block bg-secondary text-white text-xs font-bold px-4 py-2 rounded-full">🔼 Mettre à niveau</div>
          </div>
        ) : (
          <div className="space-y-2">
            <button onClick={() => CSVExport.statsByLot(user.tenantId, tenantName, currency)}
              className="w-full text-left px-4 py-3 rounded-xl bg-blue-50 hover:bg-blue-100 transition text-sm flex items-center gap-3">
              <span className="text-xl">📦</span>
              <div>
                <div className="font-semibold text-primary">Rapport par lot</div>
                <div className="text-xs text-gray-500">Stock, utilisation et valeur par lot</div>
              </div>
              <span className="ml-auto text-secondary text-xs font-bold">↓ CSV</span>
            </button>
            <button onClick={() => CSVExport.statsByAgent(user.tenantId, tenantName, currency)}
              className="w-full text-left px-4 py-3 rounded-xl bg-green-50 hover:bg-green-100 transition text-sm flex items-center gap-3">
              <span className="text-xl">👤</span>
              <div>
                <div className="font-semibold text-primary">Rapport par agent</div>
                <div className="text-xs text-gray-500">Performance de chaque agent commercial</div>
              </div>
              <span className="ml-auto text-green-600 text-xs font-bold">↓ CSV</span>
            </button>
            <button onClick={() => CSVExport.allCards(user.tenantId, tenantName, currency)}
              className="w-full text-left px-4 py-3 rounded-xl bg-amber-50 hover:bg-amber-100 transition text-sm flex items-center gap-3">
              <span className="text-xl">🗃️</span>
              <div>
                <div className="font-semibold text-primary">Export complet des cartes</div>
                <div className="text-xs text-gray-500">Toutes les cartes avec statuts (audit)</div>
              </div>
              <span className="ml-auto text-amber-600 text-xs font-bold">↓ CSV</span>
            </button>
          </div>
        )}
      </div>

      {/* Tableau par lot */}
      {byLot.length > 0 && (
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <h3 className="font-bold text-primary mb-3">📦 Par lot</h3>
          <div className="space-y-3">
            {byLot.map(lot => (
              <div key={lot.id} className="border border-gray-100 rounded-xl p-3">
                <div className="flex justify-between items-start mb-1">
                  <div className="font-semibold text-sm text-gray-800">{lot.name}</div>
                  <span className="text-xs font-bold text-primary">{lot.pct}%</span>
                </div>
                <div className="text-xs text-gray-400 mb-2">{lot.assignedName} · {lot.total} cartes</div>
                <div className="h-2 bg-gray-100 rounded-full overflow-hidden mb-1">
                  <div className="h-full bg-gradient-to-r from-secondary to-primary rounded-full"
                    style={{ width: `${lot.pct}%` }} />
                </div>
                <div className="flex gap-3 text-xs text-gray-500">
                  <span className="text-green-600 font-semibold">{lot.active} actives</span>
                  <span className="text-secondary font-semibold">{lot.redeemed} utilisées</span>
                  <span className="ml-auto">{fmtAmount(lot.redVal, currency)} encaissé</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Tableau par agent */}
      {byAgent.length > 0 && (
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <h3 className="font-bold text-primary mb-3">🏆 Performance agents</h3>
          <div className="space-y-2">
            {byAgent.map((agent, i) => (
              <div key={agent.id} className="flex items-center gap-3 p-2 rounded-xl hover:bg-gray-50">
                <div className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-black text-white
                  ${i === 0 ? 'bg-amber-400' : i === 1 ? 'bg-gray-400' : i === 2 ? 'bg-amber-700' : 'bg-gray-200 text-gray-500'}`}>
                  {i + 1}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-sm text-gray-800 truncate">{agent.name}</div>
                  <div className="text-xs text-gray-400">{agent.redeemed}/{agent.total} cartes · {agent.pct}%</div>
                </div>
                <div className="text-right">
                  <div className="text-sm font-bold text-primary">{fmtAmount(agent.redVal, currency)}</div>
                  <div className="text-xs text-gray-400">encaissé</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Stats par montant */}
      {byAmount.length > 0 && (
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <h3 className="font-bold text-primary mb-3">💰 Par montant de carte</h3>
          <div className="space-y-2">
            {byAmount.map(([amt, s]) => (
              <div key={amt} className="flex items-center gap-3 text-sm">
                <div className="w-24 font-semibold text-gray-700">{fmtAmount(Number(amt), currency)}</div>
                <div className="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden">
                  <div className="h-full bg-secondary rounded-full" style={{ width: s.total > 0 ? `${Math.round((s.redeemed/s.total)*100)}%` : '0%' }} />
                </div>
                <div className="text-xs text-gray-500 w-20 text-right">{s.redeemed}/{s.total} ({s.total > 0 ? Math.round((s.redeemed/s.total)*100) : 0}%)</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
};

// ════════════════════════════════════════════════════════════════
// PUBLIC VERIFY PAGE
// ════════════════════════════════════════════════════════════════
const PublicVerifyPage = ({ cardId, onBack }) => {
  const [result, setResult] = React.useState(null);
  const [copied, setCopied] = React.useState(false);
  React.useEffect(() => {
    const tenants = Storage.gget('tenants') || [];
    for (const t of tenants) {
      const cards = Storage.get(t.id, 'cards') || [];
      const card = cards.find(c => c.id === cardId);
      if (card) { setResult({ card, tenant: t }); return; }
    }
    setResult({ card: null });
  }, [cardId]);
  const shareUrl = `${window.location.origin}${window.location.pathname}?verify=${encodeURIComponent(cardId)}`;
  const copyLink = () => {
    navigator.clipboard?.writeText(shareUrl).then(() => { setCopied(true); setTimeout(()=>setCopied(false),2000); });
  };
  const sColors = { ACTIVE:{bg:'bg-green-50',icon:'✅'}, REDEEMED:{bg:'bg-blue-50',icon:'✔️'}, EXPIRED:{bg:'bg-gray-50',icon:'⏰'}, CANCELLED:{bg:'bg-red-50',icon:'🚫'} };
  return (
    <div className="min-h-screen flex flex-col items-center justify-center p-4"
      style={{background:'linear-gradient(135deg,#21396D 0%,#35A8E0 100%)'}}>
      <div className="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-sm"
        style={{boxShadow:'0 20px 60px rgba(33,57,109,0.25)'}}>
        <div className="text-center mb-5">
          <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-3"
            style={{background:'linear-gradient(135deg,#21396D,#35A8E0)'}}><span className="text-2xl">🎁</span></div>
          <div className="font-black text-2xl text-primary">Kado<span style={{color:BRAND.secondary}}>Link</span></div>
          <div className="text-xs text-gray-400 mt-0.5">Vérification de carte cadeau</div>
        </div>
        {!result?(<div className="flex flex-col items-center py-6 gap-3"><Spinner/><div className="text-sm text-gray-400">Recherche en cours…</div></div>)
        :!result.card?(<div className="text-center py-6 space-y-3"><div className="text-5xl">❌</div><div className="font-bold text-red-700">Carte introuvable</div><div className="text-sm text-gray-500">Ce code ne correspond à aucune carte dans notre système.</div></div>)
        :(()=>{
          const s=sColors[result.card.status]||sColors.ACTIVE;
          return (<div className="space-y-4">
            <div className="flex justify-center"><GiftCardVisual card={result.card} tenant={result.tenant} size="small"/></div>
            <div className={`${s.bg} rounded-2xl p-4 text-center`}>
              <div className="text-3xl mb-1">{s.icon}</div>
              <div className="font-black text-xl text-gray-800">{fmtAmount(result.card.amount,result.tenant.currency)}</div>
              <div className="mt-1"><Badge status={result.card.status}/></div>
            </div>
            <div className="bg-gray-50 rounded-2xl p-4 space-y-2 text-sm">
              <div className="flex justify-between"><span className="text-gray-500">Boutique</span><span className="font-semibold">{result.tenant.name}</span></div>
              {result.card.expiresAt&&(<div className="flex justify-between"><span className="text-gray-500">Expiration</span><span className={`font-semibold ${new Date(result.card.expiresAt)<new Date()?'text-red-600':'text-amber-600'}`}>{fmtDate(result.card.expiresAt)}</span></div>)}
            </div>
            <button onClick={copyLink} className="w-full py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition hover:opacity-80"
              style={{background:copied?'#E6F9EF':'#EBF4FF',color:copied?'#16A34A':'#21396D'}}>
              {copied?'✅ Lien copié !':'🔗 Copier le lien de vérification'}
            </button>
          </div>);
        })()}
        <button onClick={onBack} className="mt-4 w-full text-center text-sm text-gray-400 hover:text-gray-600">← Retour</button>
      </div>
      <p className="text-blue-200/50 text-xs mt-4">{APP_FOOTER}</p>
    </div>
  );
};

// ═/ ════════════════════════════════════════════════════════════════
// MAIN APP
// ════════════════════════════════════════════════════════════════
const App = () => {
  const [user, setUser] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [collapsed, setCollapsed] = useState(true);
  const [tenant, setTenant] = useState(null);
  const [verifyCard, setVerifyCard] = useState(null);
  const [appLoading, setAppLoading] = useState(true);

  // Vérifier URL params pour vérification publique
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    if (params.get('verify')) setVerifyCard(params.get('verify'));
  }, []);

  // Init données + chargement
  useEffect(() => {
    const init = async () => {
      await initSeedData();
      setAppLoading(false);
    };
    init();
  }, []);

  // Écouter les changements Firebase Auth
  useEffect(() => {
    if (!FB_READY || !auth) return;
    const unsub = auth.onAuthStateChanged((firebaseUser) => {
      if (!firebaseUser && user) {
        // Firebase a déconnecté l'utilisateur (token expiré)
        // On ne force pas la déconnexion locale pour ne pas casser le mode offline
        console.log('[KadoLink] Firebase auth state: signed out');
      }
    });
    return unsub;
  }, [user]);

  const handleLogin = async (u) => {
    setUser(u);
    if (u.tenantId !== 'global') {
      const tenants = Storage.gget('tenants') || [];
      const t = tenants.find(t => t.id === u.tenantId) || u.tenant;
      setTenant(t);
    }
    setPage('dashboard');
  };

  const handleLogout = async () => {
    if (FB_READY) await FirebaseAuth.signOut().catch(() => {});
    setUser(null);
    setTenant(null);
    setPage('dashboard');
  };

  if (appLoading) {
    return (
      <div className="min-h-screen flex items-center justify-center"
        style={{ background: 'linear-gradient(135deg, #21396D 0%, #35A8E0 100%)' }}>
        <div className="text-center text-white">
          <div className="text-5xl mb-4">🎁</div>
          <div className="font-black text-3xl mb-2">Kado<span style={{color:'#F7D98D'}}>Link</span></div>
          <Spinner size="lg" />
          <div className="text-blue-200 text-sm mt-3">Chargement...</div>
        </div>
      </div>
    );
  }

  if (verifyCard) {
    return <PublicVerifyPage cardId={verifyCard} onBack={() => setVerifyCard(null)} />;
  }

  if (!user) return <LoginPage onLogin={handleLogin} />;

  if (user.mustChangePin) return <ChangePinPage user={user} onDone={(u) => { setUser(u); setPage('dashboard'); }} />;

  const renderPage = () => {
    if (user.role === 'superadmin') {
      if (page === 'dashboard') return <SuperAdminDashboard user={user} />;
      if (page === 'tenants') return <TenantsPage user={user} />;
      if (page === 'users') return <UsersPage user={user} />;
      if (page === 'stats') return <StatsPage user={user} />;
      if (page === 'settings') return <SettingsPage user={user} />;
    }
    if (user.role === 'admin') {
      if (page === 'dashboard') return <AdminDashboard user={user} />;
      if (page === 'lots') return <LotsPage user={user} />;
      if (page === 'cards') return <CardsPage user={user} />;
      if (page === 'users') return <UsersPage user={user} />;
      if (page === 'scan') return <ScannerPage user={user} />;
      if (page === 'stats') return <StatsPage user={user} />;
      if (page === 'settings') return <SettingsPage user={user} />;
    }
    if (user.role === 'agent') {
      if (page === 'dashboard') return <AgentDashboard user={user} setPage={setPage} />;
      if (page === 'cards') return <CardsPage user={user} />;
      if (page === 'scan') return <ScannerPage user={user} />;
      if (page === 'profile') return <ProfilePage user={user} setPage={setPage} />;
      if (page === 'settings') return <SettingsPage user={user} />;
      if (page === 'kiosk') return <KioskPage user={user} setPage={setPage} />;
    }
    if (user.role === 'partner') {
      if (page === 'dashboard') return <AgentDashboard user={user} setPage={setPage} />;
      if (page === 'scan') return <ScannerPage user={user} />;
      if (page === 'history') return <HistoryPage user={user} />;
      if (page === 'profile') return <ProfilePage user={user} setPage={setPage} />;
      if (page === 'settings') return <SettingsPage user={user} />;
      if (page === 'kiosk') return <KioskPage user={user} setPage={setPage} />;
    }
    if (page === 'upgrade') return <UpgradePage user={user} setPage={setPage} />;
    return <div className="p-8 text-center text-gray-400">Page en cours de développement</div>;
  };

  return (
    <AppContext.Provider value={{ tenant, setTenant, user }}>
      <div className="min-h-screen bg-gray-50 flex">
        <Sidebar user={user} page={page} setPage={setPage} collapsed={collapsed} setCollapsed={setCollapsed} />

        <div className={`flex-1 flex flex-col min-h-screen transition-all ${collapsed ? 'lg:ml-16' : 'ml-0'}`}>
          <Topbar user={user} page={page} setCollapsed={setCollapsed} collapsed={collapsed} onLogout={handleLogout} />
          <main className="flex-1 overflow-y-auto pb-16" style={{ maxWidth: 768, margin: '0 auto', width: '100%' }}>
            {renderPage()}
          </main>
          <footer className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 py-2 text-center z-10">
            <p className="text-xs text-gray-400">{APP_FOOTER}</p>
          </footer>
        </div>
      </div>
    </AppContext.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<LangProvider><App /></LangProvider>);
</script>
</body>
</html>
