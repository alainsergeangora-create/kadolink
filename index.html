const LotsPage = ({ user }) => {
  const { tenant } = useApp();
  const [lots, setLots] = useState(() => Storage.get(user.tenantId, 'lots') || []);
  const [showNew, setShowNew] = useState(false);
  const [generating, setGenerating] = useState(false);
  const [form, setForm] = useState({ name: `LOT-${new Date().toISOString().slice(0,7).replace('-','')}`, assignedTo: '', hasExpiry: true, expiresAt: '', quantities: {} });

  const users = Storage.get(user.tenantId, 'users') || [];
  const agents = users.filter(u => u.role === 'agent' || u.role === 'partner');

  // Abonnement temps-réel
  useEffect(() => {
    const unsub = Storage.subscribe(user.tenantId, 'lots', (val) => { if (val) setLots(val); });
    return unsub;
  }, [user.tenantId]);

  const saveLots = (updated) => { setLots(updated); Storage.set(user.tenantId, 'lots', updated); };

  const handleCreate = async () => {
    if (!form.name || !form.assignedTo) return alert('Remplissez tous les champs requis');
    const totalQty = Object.values(form.quantities).reduce((s, v) => s + (parseInt(v) || 0), 0);
    if (totalQty === 0) return alert('Ajoutez au moins une carte');

    setGenerating(true);
    await new Promise(r => setTimeout(r, 600));

    const assignedUser = agents.find(u => u.id === form.assignedTo);
    const newLot = {
      id: form.name, name: form.name, assignedTo: form.assignedTo,
      assignedName: assignedUser?.name || '',
      createdAt: today(), hasExpiry: form.hasExpiry,
      expiresAt: form.hasExpiry ? form.expiresAt : null,
      status: 'active',
    };

    const existingCards = Storage.get(user.tenantId, 'cards') || [];
    const newCards = [];
    for (const [amtStr, qty] of Object.entries(form.quantities)) {
      const amt = parseInt(amtStr);
      const qtyN = parseInt(qty) || 0;
      for (let i = 0; i < qtyN; i++) {
        newCards.push({
          id: Crypto.cardId(user.tenantId, form.name, `${amt}-${i}-${Date.now()}`),
          lotId: form.name, amount: amt,
          units: Math.floor(amt / (tenant?.productPrice || 2000)),
          status: 'ACTIVE', assignedTo: form.assignedTo,
          createdAt: today(), expiresAt: form.hasExpiry ? form.expiresAt : null,
          redeemedAt: null, redeemedBy: null,
        });
      }
    }

    Storage.set(user.tenantId, 'cards', [...existingCards, ...newCards]);
    saveLots([...lots, newLot]);
    setGenerating(false);
    setShowNew(false);
    setForm({ name: `LOT-${new Date().toISOString().slice(0,7).replace('-','')}`, assignedTo: '', hasExpiry: true, expiresAt: '', quantities: {} });
    alert(`✅ Lot créé : ${newCards.length} cartes générées`);
  };

  const handleDelete = (lotId) => {
    if (!confirm('Supprimer ce lot et toutes ses cartes ?')) return;
    saveLots(lots.filter(l => l.id !== lotId));
    const cards = Storage.get(user.tenantId, 'cards') || [];
    Storage.set(user.tenantId, 'cards', cards.filter(c => c.lotId !== lotId));
  };

  return (
    <div className="p-4 space-y-4 fade-in">
      <div className="flex items-center justify-between">
        <h2 className="font-bold text-primary text-lg">Lots de cartes</h2>
        <Btn onClick={() => setShowNew(true)}>+ Nouveau lot</Btn>
      </div>

      {lots.length === 0 ? (
        <div className="text-center py-16 text-gray-400">
          <div className="text-5xl mb-3">📦</div>
          <div>Aucun lot créé</div>
          <Btn className="mt-4" onClick={() => setShowNew(true)}>Créer le premier lot</Btn>
        </div>
      ) : (
        <div className="space-y-3">
          {lots.map(lot => {
            const allCards = (Storage.get(user.tenantId, 'cards') || []).filter(c => c.lotId === lot.id);
            const active = allCards.filter(c => c.status === 'ACTIVE').length;
            const redeemed = allCards.filter(c => c.status === 'REDEEMED').length;
            const total = allCards.length;
            const lotThreshold = lot.alertThreshold || Math.max(5, Math.floor(total * 0.2));
            const pct = total > 0 ? Math.round((active / total) * 100) : 0;
            const isLow = active > 0 && active <= lotThreshold;
            const isCritical = active === 0 && total > 0;
            const barColor = isCritical
              ? 'bg-red-500'
              : isLow
                ? 'bg-amber-400'
                : active / total > 0.5
                  ? 'bg-green-500'
                  : 'bg-secondary';
            return (
              <div key={lot.id} className={`bg-white rounded-2xl p-4 shadow-sm border ${isCritical ? 'border-red-300' : isLow ? 'border-amber-300' : 'border-gray-100'}`}>
                <div className="flex items-start justify-between mb-2">
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2">
                      <div className="font-bold text-primary truncate">{lot.name}</div>
                      {isCritical && <span className="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded-full font-semibold animate-pulse">ÉPUISÉ</span>}
                      {isLow && !isCritical && <span className="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-semibold">⚠ Stock bas</span>}
                    </div>
                    <div className="text-xs text-gray-400 mt-0.5">
                      Assigné à : {lot.assignedName} · Créé le {fmtDate(lot.createdAt)}
                    </div>
                    {lot.hasExpiry && (() => {
                      const expDate = lot.expiresAt ? new Date(lot.expiresAt) : null;
                      const now = new Date();
                      const in7 = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
                      const isExpired = expDate && expDate < now;
                      const isSoon = expDate && !isExpired && expDate <= in7;
                      return (
                        <div className={`text-xs mt-0.5 font-medium flex items-center gap-1
                          ${isExpired ? 'text-red-600' : isSoon ? 'text-orange-600' : 'text-amber-600'}`}>
                          {isExpired ? '🔴 Expiré le' : isSoon ? '🔔 Expire dans <7j —' : '📅 Expire le'}
                          {' '}{fmtDate(lot.expiresAt)}
                          {isSoon && <span className="bg-orange-100 text-orange-700 px-1.5 py-0.5 rounded-full text-xs font-bold ml-1 animate-pulse">BIENTÔT</span>}
                          {isExpired && <span className="bg-red-100 text-red-700 px-1.5 py-0.5 rounded-full text-xs font-bold ml-1">EXPIRÉ</span>}
                        </div>
                      );
                    })()}
                  </div>
                  <Badge status={lot.status} />
                </div>
                <div className="flex gap-4 text-sm mb-2">
                  <div><span className={`font-bold ${isCritical ? 'text-red-500' : isLow ? 'text-amber-600' : 'text-green-600'}`}>{active}</span> <span className="text-gray-400">actives</span></div>
                  <div><span className="font-bold text-secondary">{redeemed}</span> <span className="text-gray-400">utilisées</span></div>
                  <div><span className="font-bold text-gray-700">{total}</span> <span className="text-gray-400">total</span></div>
                </div>
                <div className="mt-1 h-2.5 bg-gray-100 rounded-full overflow-hidden">
                  <div className={`h-full ${barColor} rounded-full transition-all duration-500`}
                    style={{ width: total > 0 ? `${pct}%` : '0%' }} />
                </div>
                <div className="flex justify-between text-xs text-gray-400 mt-1">
                  <span>{pct}% disponible</span>
                  <span>{redeemed > 0 ? `${Math.round((redeemed/total)*100)}% utilisé` : 'aucune utilisée'}</span>
                </div>
                {(isLow || isCritical) && (
                  <div className={`mt-2 text-xs px-3 py-1.5 rounded-lg ${isCritical ? 'bg-red-50 text-red-600' : 'bg-amber-50 text-amber-700'}`}>
                    {isCritical
                      ? '🔴 Ce lot est épuisé — créez un nouveau lot pour cet agent.'
                      : `🟡 Seulement ${active} cartes restantes — pensez à réapprovisionner.`}
                  </div>
                )}
                <div className="flex gap-2 mt-3">
                  <button onClick={() => handleDelete(lot.id)} className="text-xs text-red-400 hover:text-red-600">🗑 Supprimer</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {showNew && (
        <Modal title="Créer un nouveau lot" onClose={() => setShowNew(false)} wide>
          <div className="space-y-4">
            <Input label="Nom du lot *" value={form.name}
              onChange={e => setForm(f => ({...f, name: e.target.value}))} />
            <Select label="Assigner à *" value={form.assignedTo}
              onChange={e => setForm(f => ({...f, assignedTo: e.target.value}))}>
              <option value="">Choisir un agent/partenaire</option>
              {agents.map(u => <option key={u.id} value={u.id}>{u.name} ({u.role})</option>)}
            </Select>

            <div>
              <label className="text-sm font-medium text-gray-700 block mb-2">Quantités par montant</label>
              <div className="space-y-2">
                {(tenant?.cardAmounts || [10000, 20000, 50000]).map(amt => (
                  <div key={amt} className="flex items-center gap-3">
                    <div className="flex-1 text-sm text-gray-700 font-medium">{fmtAmount(amt, tenant?.currency)}</div>
                    <input type="number" min="0" max="10000"
                      className="w-24 px-3 py-2 rounded-xl border border-gray-200 text-sm text-center outline-none focus:border-secondary"
                      placeholder="0"
                      value={form.quantities[amt] || ''}
                      onChange={e => setForm(f => ({...f, quantities: {...f.quantities, [amt]: e.target.value}}))} />
                    <span className="text-xs text-gray-400">cartes</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="flex items-center gap-3">
              <input type="checkbox" id="hasExpiry" checked={form.hasExpiry}
                onChange={e => setForm(f => ({...f, hasExpiry: e.target.checked}))} className="rounded" />
              <label htmlFor="hasExpiry" className="text-sm text-gray-700">Avec date d'expiration</label>
            </div>
            {form.hasExpiry && (
              <Input label="Date d'expiration" type="date" value={form.expiresAt}
                min={today()}
                onChange={e => setForm(f => ({...f, expiresAt: e.target.value}))} />
            )}

            <div className="flex gap-3 pt-2">
              <Btn variant="outline" onClick={() => setShowNew(false)} className="flex-1">Annuler</Btn>
              <Btn onClick={handleCreate} loading={generating} className="flex-1">
                {generating ? 'Génération...' : 'Créer le lot'}
              </Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ════════════════════════════════════════════════════════════════
// CARDS PAGE — avec export PDF/PNG/JPEG/WebP
// ════════════════════════════════════════════════════════════════
const CardsPage = ({ user }) => {
  const { tenant } = useApp();
  const [cards, setCards] = useState(() => Storage.get(user.tenantId, 'cards') || []);
  const [filter, setFilter] = useState({ status: 'ALL', lot: 'ALL', search: '' });
  const [exporting, setExporting] = useState(null);
  const [page, setPage] = useState(1);
  const PER_PAGE = 20;

  const lots = Storage.get(user.tenantId, 'lots') || [];
  const [rechargeCard, setRechargeCard] = React.useState(null);
  const [rechargeVal, setRechargeVal] = React.useState('');

  const applyRecharge = () => {
    if (!rechargeCard || !rechargeVal) return;
    const allCards = Storage.get(user.tenantId, 'cards') || [];
    let updated;
    if (rechargeCard.mode === 'amount') {
      const newAmt = Number(rechargeVal);
      if (!newAmt||newAmt<=0) { alert('Montant invalide'); return; }
      updated = allCards.map(c => c.id===rechargeCard.card.id ? {...c,amount:newAmt,status:c.status==='EXPIRED'?'ACTIVE':c.status,rechargedAt:new Date().toISOString()} : c);
    } else {
      updated = allCards.map(c => c.id===rechargeCard.card.id ? {...c,expiresAt:new Date(rechargeVal).toISOString(),status:c.status==='EXPIRED'?'ACTIVE':c.status,rechargedAt:new Date().toISOString()} : c);
    }
    Storage.set(user.tenantId,'cards',updated);
    setCards(updated); setRechargeCard(null); setRechargeVal('');
  };

  // Abonnement temps-réel
  useEffect(() => {
    const unsub = Storage.subscribe(user.tenantId, 'cards', (val) => { if (val) setCards(val); });
    return unsub;
  }, [user.tenantId]);

  const myCards = useMemo(() => {
    return cards.filter(c => {
      if (user.role === 'agent') return c.assignedTo === user.id;
      return true;
    });
  }, [cards, user]);

  const filtered = useMemo(() => {
    return myCards.filter(c => {
      if (filter.status !== 'ALL' && c.status !== filter.status) return false;
      if (filter.lot !== 'ALL' && c.lotId !== filter.lot) return false;
      if (filter.search && !c.id.toLowerCase().includes(filter.search.toLowerCase())) return false;
      return true;
    });
  }, [myCards, filter]);

  const paged = filtered.slice((page - 1) * PER_PAGE, page * PER_PAGE);
  const totalPages = Math.ceil(filtered.length / PER_PAGE);

  const exportCard = async (card, format) => {
    setExporting(`${card.id}-${format}`);
    try {
      const el = document.getElementById(`card-${card.id}`);
      if (!el) { alert('Carte non trouvée'); setExporting(null); return; }

      if (format === 'PDF') {
        const canvas = await html2canvas(el, { scale: 3, useCORS: true, backgroundColor: null });
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [170, 105] });
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 5, 5, 160, 95);
        pdf.save(`KadoLink-${card.id}.pdf`);
      } else {
        const canvas = await html2canvas(el, { scale: 3, useCORS: true, backgroundColor: null });
        const mimeMap = { PNG: 'image/png', JPEG: 'image/jpeg', WebP: 'image/webp' };
        const dataUrl = canvas.toDataURL(mimeMap[format], 0.9);
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = `KadoLink-${card.id}.${format.toLowerCase()}`;
        a.click();
      }
    } catch (err) {
      console.error(err);
      alert('Erreur lors de l\'export');
    }
    setExporting(null);
  };

  const exportLot = async (lotId, format) => {
    const lotCards = cards.filter(c => c.lotId === lotId);
    if (lotCards.length === 0) return alert('Aucune carte dans ce lot');

    if (format === 'PDF') {
      setExporting(`lot-${lotId}`);
      try {
        const { jsPDF } = window.jspdf;
        const lot = lots.find(l => l.id === lotId) || { name: lotId };
        const today = new Date().toLocaleDateString('fr-FR');
        const isoDate = new Date().toISOString().slice(0,10);

        // ── Stats lot ────────────────────────────────────────────────────
        const totalActive    = lotCards.filter(c => c.status === 'ACTIVE').length;
        const totalRedeemed  = lotCards.filter(c => c.status === 'REDEEMED').length;
        const totalCancelled = lotCards.filter(c => c.status === 'CANCELLED').length;
        const totalExpired   = lotCards.filter(c => c.status === 'EXPIRED').length;
        const totalValue     = lotCards.reduce((s, c) => s + (c.amount || 0), 0);
        const redeemedValue  = lotCards.filter(c => c.status === 'REDEEMED').reduce((s, c) => s + (c.amount || 0), 0);

        // ── Paramètres page ──────────────────────────────────────────────
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        const W = 210, H = 297;
        const MARGIN = 12;
        const PRIMARY   = [33, 57, 109];   // #21396D
        const SECONDARY = [53, 168, 224];  // #35A8E0
        const ACCENT    = [247, 217, 141]; // #F7D98D
        const DARK      = [30, 30, 30];
        const GRAY      = [100, 100, 100];
        const LIGHTGRAY = [240, 242, 245];
        const WHITE     = [255, 255, 255];
        const GREEN     = [22, 163, 74];
        const RED       = [220, 38, 38];
        const ORANGE    = [234, 88, 12];

        const setFill   = (c) => pdf.setFillColor(...c);
        const setStroke = (c) => pdf.setDrawColor(...c);
        const setColor  = (c) => pdf.setTextColor(...c);
        const setFont   = (size, style='normal', family='helvetica') => { pdf.setFontSize(size); pdf.setFont(family, style); };

        // ════════════════════════════════════════════════════════════════
        // PAGE 1 — En-tête + Résumé lot
        // ════════════════════════════════════════════════════════════════

        // Bandeau header
        setFill(PRIMARY);
        pdf.rect(0, 0, W, 32, 'F');

        // Logo / Titre
        setColor(WHITE);
        setFont(18, 'bold');
        pdf.text('KadoLink', MARGIN, 14);
        setFont(8, 'normal');
        pdf.text('Plateforme de Cartes Cadeaux', MARGIN, 20);

        // Date + Lot
        setFont(8, 'normal');
        pdf.text(`Généré le ${today}`, W - MARGIN, 10, { align: 'right' });
        setFont(10, 'bold');
        pdf.text(`Rapport de Lot`, W - MARGIN, 18, { align: 'right' });

        // Accent line
        setFill(ACCENT);
        pdf.rect(0, 32, W, 3, 'F');

        // Infos lot
        let yy = 44;
        setColor(PRIMARY);
        setFont(15, 'bold');
        pdf.text(lot.name || lotId, MARGIN, yy);
        yy += 7;
        setFont(9, 'normal');
        setColor(GRAY);
        pdf.text(`ID : ${lotId}`, MARGIN, yy);
        if (lot.expiresAt) pdf.text(`Expiration : ${new Date(lot.expiresAt).toLocaleDateString('fr-FR')}`, MARGIN + 60, yy);
        yy += 10;

        // ── Cartes stats tiles (2×3) ──────────────────────────────────
        const tiles = [
          { label: 'Total cartes',   value: lotCards.length,  color: PRIMARY },
          { label: 'Valeur totale',  value: totalValue.toLocaleString('fr-FR') + ' FCFA', color: SECONDARY },
          { label: 'Actives',        value: totalActive,       color: GREEN },
          { label: 'Utilisées',      value: totalRedeemed,     color: ORANGE },
          { label: 'Annulées',       value: totalCancelled,    color: RED },
          { label: 'CA encaissé',    value: redeemedValue.toLocaleString('fr-FR') + ' FCFA', color: ACCENT, textColor: DARK },
        ];
        const TW = (W - MARGIN*2 - 10) / 3;
        const TH = 20;
        tiles.forEach((tile, i) => {
          const col = i % 3;
          const row = Math.floor(i / 3);
          const tx = MARGIN + col * (TW + 5);
          const ty = yy + row * (TH + 4);
          setFill(tile.color);
          pdf.roundedRect(tx, ty, TW, TH, 2, 2, 'F');
          setColor(tile.textColor || WHITE);
          setFont(7, 'normal');
          pdf.text(tile.label, tx + TW/2, ty + 6, { align: 'center' });
          setFont(10, 'bold');
          pdf.text(String(tile.value), tx + TW/2, ty + 15, { align: 'center' });
        });
        yy += 2 * (TH + 4) + 8;

        // Séparateur
        setFill(LIGHTGRAY);
        pdf.rect(MARGIN, yy, W - MARGIN*2, 0.5, 'F');
        yy += 6;

        // ── Table des cartes ──────────────────────────────────────────
        setColor(PRIMARY);
        setFont(11, 'bold');
        pdf.text('Liste des cartes', MARGIN, yy);
        yy += 6;

        // En-tête tableau
        const cols = { code: MARGIN, montant: MARGIN+70, statut: MARGIN+110, date: MARGIN+150 };
        setFill(PRIMARY);
        pdf.rect(MARGIN, yy, W - MARGIN*2, 7, 'F');
        setColor(WHITE);
        setFont(7, 'bold');
        pdf.text('Code Carte', cols.code + 2, yy + 5);
        pdf.text('Montant', cols.montant, yy + 5);
        pdf.text('Statut', cols.statut, yy + 5);
        pdf.text('Date util.', cols.date, yy + 5);
        yy += 7;

        const statusColor = { ACTIVE: GREEN, REDEEMED: ORANGE, CANCELLED: RED, EXPIRED: [120,120,120] };
        const statusLabel = { ACTIVE: 'Active', REDEEMED: 'Utilisée', CANCELLED: 'Annulée', EXPIRED: 'Expirée' };

        for (let i = 0; i < lotCards.length; i++) {
          if (yy > H - 25) {
            // Pied de page
            setColor(GRAY);
            setFont(7, 'normal');
            pdf.text(`KadoLink · ${lot.name} · ${today}`, W/2, H - 8, { align: 'center' });
            pdf.text(`Page ${pdf.internal.getNumberOfPages()}`, W - MARGIN, H - 8, { align: 'right' });
            pdf.addPage();
            // Petit header sur pages suivantes
            setFill(PRIMARY);
            pdf.rect(0, 0, W, 10, 'F');
            setColor(WHITE);
            setFont(7, 'normal');
            pdf.text(`KadoLink — Rapport Lot : ${lot.name}`, MARGIN, 7);
            yy = 18;
            // Ré-en-tête tableau
            setFill(PRIMARY);
            pdf.rect(MARGIN, yy, W - MARGIN*2, 7, 'F');
            setColor(WHITE);
            setFont(7, 'bold');
            pdf.text('Code Carte', cols.code + 2, yy + 5);
            pdf.text('Montant', cols.montant, yy + 5);
            pdf.text('Statut', cols.statut, yy + 5);
            pdf.text('Date util.', cols.date, yy + 5);
            yy += 7;
          }

          const card = lotCards[i];
          const rowBg = i % 2 === 0 ? LIGHTGRAY : WHITE;
          setFill(rowBg);
          pdf.rect(MARGIN, yy, W - MARGIN*2, 6, 'F');

          setColor(DARK);
          setFont(6.5, 'normal');
          // Code en mono (simulé avec espacement)
          pdf.text(card.id || '-', cols.code + 2, yy + 4.3);
          pdf.text(`${(card.amount||0).toLocaleString('fr-FR')} F`, cols.montant, yy + 4.3);

          // Badge statut coloré
          const sc = statusColor[card.status] || GRAY;
          const sl = statusLabel[card.status] || card.status;
          setFill(sc);
          pdf.roundedRect(cols.statut, yy + 1, 28, 4.5, 1, 1, 'F');
          setColor(WHITE);
          setFont(5.5, 'bold');
          pdf.text(sl, cols.statut + 14, yy + 4.3, { align: 'center' });

          // Date d'utilisation
          setColor(GRAY);
          setFont(6, 'normal');
          const dateUtil = card.redeemedAt ? new Date(card.redeemedAt).toLocaleDateString('fr-FR') : '-';
          pdf.text(dateUtil, cols.date, yy + 4.3);

          yy += 6;
        }

        // ── Pied de dernière page ────────────────────────────────────
        setFill(LIGHTGRAY);
        pdf.rect(0, H - 15, W, 15, 'F');
        setColor(GRAY);
        setFont(7, 'normal');
        pdf.text(`KadoLink · Rapport officiel de lot · ${today}`, W/2, H - 8, { align: 'center' });
        pdf.text(`Page ${pdf.internal.getNumberOfPages()}`, W - MARGIN, H - 8, { align: 'right' });
        setColor(SECONDARY);
        setFont(6, 'normal');
        pdf.text('kadolink-b8023.web.app', MARGIN, H - 8);

        // ── Sauvegarde ────────────────────────────────────────────────
        const safeName = (lot.name || lotId).replace(/[^a-zA-Z0-9_-]/g, '_');
        pdf.save(`KadoLink-${safeName}-${isoDate}.pdf`);

      } catch (e) {
        console.error('Export lot PDF:', e);
        alert("Erreur lors de l'export PDF : " + e.message);
      }
      setExporting(null);
    }
  };

  const cancelCard = (cardId) => {
    if (!confirm('Annuler cette carte ?')) return;
    const updated = cards.map(c => c.id === cardId ? { ...c, status: 'CANCELLED' } : c);
    setCards(updated);
    Storage.set(user.tenantId, 'cards', updated);
  };

  return (
    <div className="p-4 space-y-4 fade-in">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <h2 className="font-bold text-primary text-lg">Cartes ({filtered.length})</h2>
        {user.role === 'admin' && lots.length > 0 && (
          <div className="flex items-center gap-2">
            <select
              className="text-xs px-2 py-1 rounded-xl border border-gray-200 outline-none focus:border-secondary bg-white"
              id="lot-export-select"
              defaultValue={lots[0]?.id}
            >
              {lots.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
            </select>
            <Btn variant="outline" size="sm"
              disabled={exporting !== null}
              onClick={() => {
                const sel = document.getElementById('lot-export-select');
                exportLot(sel ? sel.value : lots[0]?.id, 'PDF');
              }}>
              {exporting && exporting.startsWith('lot-') ? '⏳ Export...' : '📄 Export lot PDF'}
            </Btn>
          </div>
        )}
      </div>

      <div className="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 space-y-2">
        <input type="text" placeholder="🔍 Rechercher par ID..."
          className="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm outline-none focus:border-secondary"
          value={filter.search} onChange={e => setFilter(f => ({...f, search: e.target.value}))} />
        <div className="flex gap-2 flex-wrap">
          {['ALL','ACTIVE','REDEEMED','EXPIRED','CANCELLED'].map(s => (
            <button key={s} onClick={() => setFilter(f => ({...f, status: s}))}
              className={`px-3 py-1 rounded-full text-xs font-medium transition
                ${filter.status === s ? 'bg-primary text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
              {s === 'ALL' ? 'Toutes' : s}
            </button>
          ))}
        </div>
        {lots.length > 0 && (
          <select className="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm bg-white"
            value={filter.lot} onChange={e => setFilter(f => ({...f, lot: e.target.value}))}>
            <option value="ALL">Tous les lots</option>
            {lots.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
          </select>
        )}
      </div>

      {paged.length === 0 ? (
        <div className="text-center py-16 text-gray-400"><div className="text-4xl mb-2">🃏</div>Aucune carte</div>
      ) : (
        <div className="space-y-3">
          {paged.map(card => (
            <div key={card.id} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
              <div className="p-3 flex justify-center bg-gray-50">
                <GiftCardVisual card={card} tenant={tenant} size="small" />
              </div>
              <div className="p-3 space-y-2">
                <div className="flex items-center justify-between">
                  <div>
                    <div className="text-xs text-gray-400 font-mono">{card.id}</div>
                    <div className="font-bold text-primary">{fmtAmount(card.amount, tenant?.currency)}</div>
                    <div className="text-xs text-gray-500">{card.units} {tenant?.productName || 'unités'} · Lot : {card.lotId}</div>
                  </div>
                  <Badge status={card.status} />
                </div>

                {card.expiresAt && <div className="text-xs text-amber-600">📅 Exp: {fmtDate(card.expiresAt)}</div>}
                {card.redeemedAt && <div className="text-xs text-green-600">✅ Utilisé le {fmtDate(card.redeemedAt)}</div>}

                <div className="flex gap-1.5 flex-wrap pt-1">
                  {['PDF','PNG','JPEG','WebP'].map(fmt => (
                    <button key={fmt}
                      disabled={exporting === `${card.id}-${fmt}`}
                      onClick={() => exportCard(card, fmt)}
                      className="px-2 py-1 rounded-lg bg-gray-100 hover:bg-secondary hover:text-white text-xs font-medium transition disabled:opacity-50">
                      {exporting === `${card.id}-${fmt}` ? '...' : fmt}
                    </button>
                  ))}
                {user.role === 'admin' && (<>
                  <button onClick={() => { setRechargeCard({ card, mode: 'amount' }); setRechargeVal(''); }}
                    className="px-2 py-1 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-medium transition">💰 Montant</button>
                  <button onClick={() => { setRechargeCard({ card, mode: 'expiry' }); setRechargeVal(''); }}
                    className="px-2 py-1 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-700 text-xs font-medium transition">📅 Prolonger</button>
                </>)}
                  {user.role === 'admin' && card.status === 'ACTIVE' && (
                    <button onClick={() => cancelCard(card.id)}
                      className="px-2 py-1 rounded-lg bg-red-50 hover:bg-red-100 text-red-500 text-xs font-medium transition">
                      Annuler
                    </button>
                  )}
                </div>
              </div>
            </div>
          ))}
        </div>
      )}


      {rechargeCard && user.role === 'admin' && (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-4">
          <div className="bg-white rounded-2xl p-5 w-full max-w-sm shadow-2xl">
            <div className="font-bold text-primary text-lg mb-2">{rechargeCard.mode==='amount'?'💰 Modifier le montant':'📅 Prolonger la validité'}</div>
            {rechargeCard.mode==='amount'?(<div>
              <label className="text-xs font-semibold text-gray-600 block mb-1">Nouveau montant</label>
              <input type="number" min="1" value={rechargeVal} onChange={e=>setRechargeVal(e.target.value)} placeholder={String(rechargeCard.card.amount)} className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-secondary"/>
              <div className="text-xs text-gray-400 mt-1">Actuel : {fmtAmount(rechargeCard.card.amount,tenant?.currency)}</div>
            </div>):(<div>
              <label className="text-xs font-semibold text-gray-600 block mb-1">Nouvelle date d'expiration</label>
              <input type="date" value={rechargeVal} onChange={e=>setRechargeVal(e.target.value)} min={new Date().toISOString().slice(0,10)} className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-secondary"/>
              {rechargeCard.card.expiresAt&&<div className="text-xs text-gray-400 mt-1">Actuelle : {fmtDate(rechargeCard.card.expiresAt)}</div>}
            </div>)}
            {rechargeCard.card.status==='EXPIRED'&&(<div className="mt-2 text-xs text-green-700 bg-green-50 rounded-lg px-3 py-1.5">✅ La carte sera réactivée (ACTIVE) après modification</div>)}
            <div className="flex gap-2 mt-4">
              <Btn variant="outline" onClick={()=>{setRechargeCard(null);setRechargeVal('');}} className="flex-1">Annuler</Btn>
              <Btn onClick={applyRecharge} className="flex-1">Appliquer</Btn>
            </div>
          </div>
        </div>
      )}
      {totalPages > 1 && (
        <div className="flex items-center justify-center gap-2">
          <Btn variant="ghost" size="sm" disabled={page === 1} onClick={() => setPage(p => p-1)}>◀</Btn>
          <span className="text-sm text-gray-600">{page} / {totalPages}</span>
          <Btn variant="ghost" size="sm" disabled={page === totalPages} onClick={() => setPage(p => p+1)}>▶</Btn>
        </div>
      )}
    </div>
  );
};

// ════════════════════════════════════════════════════════════════
// SCANNER PAGE
// ════════════════════════════════════════════════════════════════
const ScannerPage = ({ user }) => {
  const { tenant } = useApp();
  const [scanning, setScanning] = useState(false);
  const [manualId, setManualId] = useState('');
  const [result, setResult] = useState(null);
  const [history, setHistory] = useState(() => Storage.get(user.tenantId, `scans-${user.id}`) || []);
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const animRef = useRef(null);

  // Abonnement temps-réel historique
  useEffect(() => {
    const unsub = Storage.subscribe(user.tenantId, `scans-${user.id}`, (val) => { if (val) setHistory(val); });
    return unsub;
  }, [user.tenantId, user.id]);

  const validateCard = useCallback((cardId) => {
    const cards = Storage.get(user.tenantId, 'cards') || [];
    const card = cards.find(c => c.id === cardId);

    if (!card) return setResult({ ok: false, msg: 'Carte inconnue ou invalide', cardId });

    if (user.role === 'agent') {
      if (card.assignedTo !== user.id) return setResult({ ok: false, msg: 'Cette carte n\'est pas dans votre lot', card });
    }

    if (card.status === 'REDEEMED') return setResult({ ok: false, msg: 'Carte déjà utilisée', card });
    if (card.status === 'CANCELLED') return setResult({ ok: false, msg: 'Carte annulée', card });
    if (card.status === 'EXPIRED') return setResult({ ok: false, msg: 'Carte expirée', card });
    if (card.expiresAt && new Date(card.expiresAt) < new Date()) {
      const updated = cards.map(c => c.id === cardId ? {...c, status: 'EXPIRED'} : c);
      Storage.set(user.tenantId, 'cards', updated);
      return setResult({ ok: false, msg: 'Carte expirée', card });
    }

    // Valider la carte
    const updatedCards = cards.map(c =>
      c.id === cardId ? { ...c, status: 'REDEEMED', redeemedAt: new Date().toISOString(), redeemedBy: user.id } : c
    );
    Storage.set(user.tenantId, 'cards', updatedCards);

    // Enregistrer dans l'historique (fonctionne offline → sync quand reconnecté)
    const scan = { cardId, at: new Date().toISOString(), by: user.id, byName: user.name, amount: card.amount, status: 'ok' };
    const newHistory = [scan, ...history].slice(0, 100);
    setHistory(newHistory);
    Storage.set(user.tenantId, `scans-${user.id}`, newHistory);

    setResult({ ok: true, msg: `✅ Carte validée — ${fmtAmount(card.amount, tenant?.currency)}`, card: {...card, status: 'REDEEMED'} });
  }, [user, tenant, history]);

  const startCamera = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
      });
      streamRef.current = stream;
      if (videoRef.current) {
        videoRef.current.srcObject = stream;
        videoRef.current.play();
        setScanning(true);
        scanFrame();
      }
    } catch {
      alert('Accès caméra refusé. Utilisez la saisie manuelle.');
    }
  };

  const scanFrame = () => {
    const video = videoRef.current;
    const canvas = canvasRef.current;
    if (!video || !canvas) return;
    const ctx = canvas.getContext('2d');
    canvas.width = video.videoWidth || 320;
    canvas.height = video.videoHeight || 240;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height);
    if (code) {
      stopCamera();
      try {
        const data = JSON.parse(code.data);
        validateCard(data.id || code.data);
      } catch {
        validateCard(code.data);
      }
      return;
    }
    animRef.current = requestAnimationFrame(scanFrame);
  };

  const stopCamera = () => {
    if (animRef.current) cancelAnimationFrame(animRef.current);
    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    setScanning(false);
  };

  const handleManual = () => {
    if (!manualId.trim()) return;
    validateCard(manualId.trim().toUpperCase());
    setManualId('');
  };

  useEffect(() => () => stopCamera(), []);

  return (
    <div className="p-4 space-y-4 fade-in">
      <h2 className="font-bold text-primary text-lg">Scanner une carte</h2>

      {result && (
        <div className={`rounded-2xl p-5 text-center fade-in ${result.ok ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'}`}>
          <div className="text-5xl mb-2">{result.ok ? '✅' : '❌'}</div>
          <div className={`font-bold text-lg ${result.ok ? 'text-green-700' : 'text-red-700'}`}>{result.msg}</div>
          {result.card && (
            <div className="mt-2 text-sm text-gray-600">
              <div>{result.card.id}</div>
              <div>{fmtAmount(result.card.amount, tenant?.currency)} · {result.card.units} {tenant?.productName}</div>
            </div>
          )}
          <button onClick={() => setResult(null)}
            className="mt-3 px-4 py-2 rounded-xl bg-white border border-gray-200 text-sm font-medium hover:bg-gray-50">
            Scanner une autre carte
          </button>
        </div>
      )}

      {!result && (
        <>
          <div className="relative bg-black rounded-2xl overflow-hidden" style={{ minHeight: 280 }}>
            <video ref={videoRef} className="w-full object-cover" playsInline muted style={{ maxHeight: 320 }} />
            <canvas ref={canvasRef} className="hidden" />

            {scanning && (
              <div className="absolute inset-0 flex items-center justify-center">
                <div className="relative" style={{ width: 220, height: 220 }}>
                  <div className="absolute inset-0 border-2 border-secondary rounded-lg" />
                  <div className="absolute top-0 left-0 w-6 h-6 border-t-4 border-l-4 border-secondary rounded-tl-lg" />
                  <div className="absolute top-0 right-0 w-6 h-6 border-t-4 border-r-4 border-secondary rounded-tr-lg" />
                  <div className="absolute bottom-0 left-0 w-6 h-6 border-b-4 border-l-4 border-secondary rounded-bl-lg" />
                  <div className="absolute bottom-0 right-0 w-6 h-6 border-b-4 border-r-4 border-secondary rounded-br-lg" />
                  <div className="absolute left-0 right-0 h-0.5 bg-secondary opacity-70" style={{ animation: 'scan 2s linear infinite', top: '50%' }} />
                </div>
              </div>
            )}

            {!scanning && (
              <div className="absolute inset-0 flex items-center justify-center">
                <div className="text-center text-white">
                  <div className="text-6xl mb-3">📷</div>
                  <Btn onClick={startCamera} size="lg" variant="secondary">Démarrer le scanner</Btn>
                </div>
              </div>
            )}
          </div>

          {scanning && (
            <Btn variant="outline" onClick={stopCamera} className="w-full">⏹ Arrêter</Btn>
          )}

          <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
            <div className="text-sm font-medium text-gray-700 mb-2">Saisie manuelle de l'ID</div>
            <div className="flex gap-2">
              <input
                className="flex-1 px-3 py-2.5 rounded-xl border border-gray-200 text-sm uppercase font-mono outline-none focus:border-secondary"
                placeholder="GIFT-XXXXXX-XXXXXX"
                value={manualId}
                onChange={e => setManualId(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleManual()}
              />
              <Btn onClick={handleManual}>Valider</Btn>
            </div>
          </div>
        </>
      )}

      {history.length > 0 && (
        <div>
          <h3 className="font-bold text-primary mb-2">Historique récent</h3>
          <div className="space-y-2">
            {history.slice(0, 10).map((h, i) => (
              <div key={i} className="bg-white rounded-xl p-3 border border-gray-100 flex items-center justify-between">
                <div>
                  <div className="text-xs font-mono text-gray-500">{h.cardId?.slice(0, 18)}</div>
                  <div className="text-xs text-gray-400">{new Date(h.at).toLocaleString('fr-FR')}</div>
                </div>
                <div className={`text-xs font-semibold px-2 py-0.5 rounded-full ${h.status === 'ok' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'}`}>
                  {fmtAmount(h.amount, tenant?.currency)}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
};

// USERS / ÉQUIPE PAGE
// ════════════════════════════════════════════════════════════════
const UsersPage = ({ user }) => {
  const { tenant } = useApp();
  const [users, setUsers] = useState(() => {
    if (user.role === 'superadmin') return [];
    return Storage.get(user.tenantId, 'users') || [];
  });
  const [showNew, setShowNew] = useState(false);
  const [form, setForm] = useState({ name: '', role: 'agent', pin: '' });
  const [resetPinUser, setResetPinUser] = useState(null);
  const [newTempPin, setNewTempPin] = useState('');

  // Abonnement temps-réel
  useEffect(() => {
    if (user.role === 'superadmin') return;
    const unsub = Storage.subscribe(user.tenantId, 'users', (val) => { if (val) setUsers(val); });
    return unsub;
  }, [user.tenantId, user.role]);

  const saveUsers = (updated) => { setUsers(updated); Storage.set(user.tenantId, 'users', updated); };

  const prefix = tenant?.name?.slice(0,3).toUpperCase() || 'TEN';

  const handleCreate = async () => {
    if (!form.name || !form.role) return alert('Remplissez tous les champs');
    const idx = users.length + 1;
    const mat = Crypto.matricule(prefix, idx);
    const tempPin = form.pin || String(Math.floor(1000 + Math.random() * 9000));
    const newUser = {
      id: `u${Date.now()}`, matricule: mat, pin: tempPin,
      role: form.role, name: form.name,
      mustChangePin: true, active: true,
    };

    // Créer le compte Firebase Auth si disponible
    if (FB_READY) {
      await FirebaseAuth.createAccount(mat, tempPin, user.tenantId).catch(() => {});
    }

    saveUsers([...users, newUser]);
    setShowNew(false);
    setForm({ name: '', role: 'agent', pin: '' });
    alert(`✅ Utilisateur créé\nMatricule : ${mat}\nPIN temporaire : ${tempPin}`);
  };

  const toggleActive = (uid) => {
    saveUsers(users.map(u => u.id === uid ? {...u, active: !u.active} : u));
  };

  const handleResetPin = async () => {
    if (!newTempPin || newTempPin.length < 4) return alert('PIN minimum 4 caractères');
    // Mettre à jour dans localStorage + Firestore
    saveUsers(users.map(u => u.id === resetPinUser.id ? {...u, pin: newTempPin, mustChangePin: true} : u));
    // Tenter de mettre à jour Firebase Auth (best-effort)
    if (FB_READY) {
      await FirebaseAuth.resetPin(resetPinUser.matricule, newTempPin, user.tenantId).catch(() => {});
    }
    setResetPinUser(null);
    setNewTempPin('');
    alert(`✅ PIN réinitialisé.\nMatricule : ${resetPinUser.matricule}\nNouv. PIN : ${newTempPin}\nL'utilisateur devra le changer à la prochaine connexion.`);
  };

  return (
    <div className="p-4 space-y-4 fade-in">
      <div className="flex items-center justify-between">
        <h2 className="font-bold text-primary text-lg">Équipe ({users.length})</h2>
        {user.role !== 'superadmin' && <Btn onClick={() => setShowNew(true)}>+ Ajouter</Btn>}
      </div>

      {users.length === 0 ? (
        <div className="text-center py-16 text-gray-400"><div className="text-4xl mb-2">👥</div>Aucun utilisateur</div>
      ) : (
        <div className="space-y-2">
          {users.map(u => (
            <div key={u.id} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
              <div className="flex items-center gap-3">
                <div className={`w-10 h-10 rounded-full flex items-center justify-center text-white font-bold
                  ${u.role === 'admin' ? 'bg-primary' : u.role === 'agent' ? 'bg-secondary' : 'bg-amber-500'}`}>
                  {u.name.charAt(0)}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="font-semibold truncate">{u.name}</div>
                  <div className="text-xs text-gray-400">{u.matricule} · {u.role}</div>
                  {u.mustChangePin && <div className="text-xs text-amber-600">⚠️ PIN temporaire</div>}
                </div>
                <Badge status={u.active ? 'active' : 'inactive'} />
              </div>
              <div className="flex gap-2 mt-3">
                <button onClick={() => toggleActive(u.id)}
                  className="text-xs text-gray-400 hover:text-gray-700 px-2 py-1 rounded-lg bg-gray-50 hover:bg-gray-100">
                  {u.active ? 'Désactiver' : 'Activer'}
                </button>
                <button onClick={() => { setResetPinUser(u); setNewTempPin(''); }}
                  className="text-xs text-secondary hover:text-secondary px-2 py-1 rounded-lg bg-blue-50 hover:bg-blue-100">
                  🔑 Réinitialiser PIN
                </button>
              </div>
            </div>
          ))}
        </div>
      )}

      {showNew && (
        <Modal title="Ajouter un utilisateur" onClose={() => setShowNew(false)}>
          <div className="space-y-4">
            <Input label="Nom complet *" value={form.name} onChange={e => setForm(f => ({...f, name: e.target.value}))} />
            <Select label="Rôle *" value={form.role} onChange={e => setForm(f => ({...f, role: e.target.value}))}>
              <option value="agent">Agent commercial</option>
              <option value="partner">Partenaire commercial</option>
              {user.role === 'admin' && <option value="admin">Admin tenant</option>}
            </Select>
            <Input label="PIN temporaire (laissez vide pour auto)" type="text" placeholder="4-6 chiffres"
              value={form.pin} onChange={e => setForm(f => ({...f, pin: e.target.value}))} />
            <div className="flex gap-3">
              <Btn variant="outline" onClick={() => setShowNew(false)} className="flex-1">Annuler</Btn>
              <Btn onClick={handleCreate} className="flex-1">Créer</Btn>
            </div>
          </div>
        </Modal>
      )}

      {resetPinUser && (
        <Modal title={`Réinitialiser PIN — ${resetPinUser.name}`} onClose={() => setResetPinUser(null)}>
          <div className="space-y-4">
            <Alert type="warn">L'utilisateur devra changer ce PIN temporaire à sa prochaine connexion.</Alert>
            <Input label="Nouveau PIN temporaire *" type="text" placeholder="4-6 caractères"
              value={newTempPin} onChange={e => setNewTempPin(e.target.value)} />
            <div className="flex gap-3">
              <Btn variant="outline" onClick={() => setResetPinUser(null)} className="flex-1">Annuler</Btn>
              <Btn onClick={handleResetPin} className="flex-1">Réinitialiser</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
};

// TENANTS PAGE (super admin)
// ════════════════════════════════════════════════════════════════
const TenantsPage = ({ user }) => {
  const [tenants, setTenants] = useState(() => Storage.gget('tenants') || []);
  const [showNew, setShowNew] = useState(false);
  const [editTenant, setEditTenant] = useState(null);
  const [form, setForm] = useState({ name: '', logo: '🎁', currency: 'FCFA', productName: 'Unité', productPrice: 2000, cardAmounts: '10000,20000,50000', alertThreshold: 100, plan: 'Free' });

  // Abonnement temps-réel
  useEffect(() => {
    const unsub = Storage.subscribeGlobal('tenants', (val) => { if (val) setTenants(val); });
    return unsub;
  }, []);

  const saveTenants = (updated) => { setTenants(updated); Storage.gset('tenants', updated); };

  const handleCreate = async () => {
    if (!form.name) return alert('Nom requis');
    const slug = slugify(form.name);
    const amounts = form.cardAmounts.split(',').map(a => parseInt(a.trim())).filter(Boolean);
    const t = {
      id: slug, name: form.name, slug, logo: form.logo,
      url: `${slug}.kadolink.ci`,
      colors: { primary: BRAND.primary, secondary: BRAND.secondary },
      currency: form.currency, productName: form.productName,
      productPrice: parseInt(form.productPrice),
      cardAmounts: amounts, alertThreshold: parseInt(form.alertThreshold),
      plan: form.plan, active: true, createdAt: today(),
    };
    const adminPrefix = slug.slice(0,3).toUpperCase();
    const adminMat = `${adminPrefix}-0001`;
    const adminPin = String(Math.floor(10000 + Math.random() * 90000));
    const adminUser = {
      id: 'u1', matricule: adminMat, pin: adminPin,
      role: 'admin', name: `Admin ${form.name}`,
      mustChangePin: true, active: true,
    };
    Storage.set(slug, 'users', [adminUser]);
    saveTenants([...tenants, t]);
    // Créer le compte Firebase Auth de l'admin tenant
    if (FB_READY) {
      await FirebaseAuth.createAccount(adminMat, adminPin, slug).catch(() => {});
    }
    setShowNew(false);
    setForm({ name: '', logo: '🎁', currency: 'FCFA', productName: 'Unité', productPrice: 2000, cardAmounts: '10000,20000,50000', alertThreshold: 100, plan: 'Free' });
    alert(`✅ Tenant créé !\nURL : ${slug}.kadolink.ci\nAdmin : ${adminMat} / PIN : ${adminPin}`);
  };

  const toggleActive = (id) => {
    saveTenants(tenants.map(t => t.id === id ? {...t, active: !t.active} : t));
  };

  const handleEditSave = () => {
    if (!editTenant) return;
    saveTenants(tenants.map(t => t.id === editTenant.id ? { ...t,
      alertThreshold: parseInt(editTenant.alertThreshold),
      plan: editTenant.plan, logo: editTenant.logo,
      productPrice: parseInt(editTenant.productPrice),
      cardAmounts: (typeof editTenant.cardAmounts === 'string'
        ? editTenant.cardAmounts.split(',').map(a => parseInt(a.trim())).filter(Boolean)
        : editTenant.cardAmounts),
    } : t));
    setEditTenant(null);
    alert('✅ Tenant mis à jour');
  };

  return (
    <div className="p-4 space-y-4 fade-in">
      <div className="flex items-center justify-between gap-2 flex-wrap">
        <h2 className="font-bold text-primary text-lg">Tenants ({tenants.length})</h2>
        <div className="flex gap-2">
          <button onClick={() => CSVExport.globalBilling(tenants)}
            className="text-xs px-3 py-2 rounded-xl bg-green-50 hover:bg-green-100 text-green-700 font-semibold flex items-center gap-1 border border-green-200">
            📥 Facturation CSV
          </button>
          <Btn onClick={() => setShowNew(true)}>+ Nouveau tenant</Btn>
        </div>
      </div>

      <div className="space-y-3">
        {tenants.map(t => {
          const tCards = Storage.get(t.id, 'cards') || [];
          const tenantUsers = Storage.get(t.id, 'users') || [];
          const activeCards = tCards.filter(c => c.status === 'ACTIVE').length;
          const tThreshold = t.alertThreshold || 100;
          const tStockLow = activeCards < tThreshold && tCards.length > 0;
          const tStockEmpty = activeCards === 0 && tCards.length > 0;
          return (
            <div key={t.id} className={`bg-white rounded-2xl p-4 shadow-sm border ${tStockEmpty ? 'border-red-200' : tStockLow ? 'border-amber-200' : 'border-gray-100'}`}>
              <div className="flex items-start gap-3">
                <span className="text-3xl">{t.logo}</span>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <div className="font-bold text-primary truncate">{t.name}</div>
                    <Badge status={t.active ? 'active' : 'inactive'} />
                    {tStockEmpty && <span className="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded-full font-semibold animate-pulse">ÉPUISÉ</span>}
                    {tStockLow && !tStockEmpty && <span className="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">⚠ Stock bas</span>}
                  </div>
                  <div className="text-xs text-secondary mt-0.5">{t.url}</div>
                  <div className="text-xs text-gray-400 mt-0.5">
                    Plan : {t.plan} · <span className={tStockLow ? (tStockEmpty ? 'text-red-500 font-semibold' : 'text-amber-600 font-semibold') : ''}>{activeCards} actives</span> / {tCards.length} total · {tenantUsers.length} users
                  </div>
                  <div className="text-xs text-gray-400 mt-0.5">
                    Montants : {(t.cardAmounts || []).map(a => fmtAmount(a, t.currency)).join(' / ')} · Seuil : {tThreshold}
                  </div>
                  {tCards.length > 0 && (
                    <div className="mt-2 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                      <div className={`h-full rounded-full transition-all ${tStockEmpty ? 'bg-red-400' : tStockLow ? 'bg-amber-400' : 'bg-green-500'}`}
                        style={{ width: `${Math.round((activeCards / tCards.length) * 100)}%` }} />
                    </div>
                  )}
                </div>
              </div>
              <div className="flex gap-2 mt-3 flex-wrap">
                <button onClick={() => setEditTenant({...t, cardAmounts: (t.cardAmounts || []).join(',')})}
                  className="text-xs text-secondary px-2 py-1 rounded-lg bg-blue-50 hover:bg-blue-100">✏️ Modifier</button>
                <button onClick={() => toggleActive(t.id)}
                  className="text-xs text-gray-500 px-2 py-1 rounded-lg bg-gray-50 hover:bg-gray-100">
                  {t.active ? 'Suspendre' : 'Réactiver'}
                </button>
              </div>
            </div>
          );
        })}
      </div>

      {showNew && (
        <Modal title="Créer un tenant" onClose={() => setShowNew(false)} wide>
          <div className="space-y-3">
            <Input label="Nom du tenant *" value={form.name} onChange={e => setForm(f => ({...f, name: e.target.value}))} />
            {form.name && <div className="text-xs text-secondary">URL : {slugify(form.name)}.kadolink.ci</div>}
            <div className="grid grid-cols-2 gap-3">
              <Input label="Logo (emoji)" value={form.logo} onChange={e => setForm(f => ({...f, logo: e.target.value}))} />
              <Input label="Devise" value={form.currency} onChange={e => setForm(f => ({...f, currency: e.target.value}))} />
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Input label="Produit" value={form.productName} onChange={e => setForm(f => ({...f, productName: e.target.value}))} />
              <Input label="Prix unitaire" type="number" value={form.productPrice} onChange={e => setForm(f => ({...f, productPrice: e.target.value}))} />
            </div>
            <Input label="Montants des cartes (séparés par virgule)" value={form.cardAmounts} onChange={e => setForm(f => ({...f, cardAmounts: e.target.value}))} />
            <div className="grid grid-cols-2 gap-3">
              <Input label="Seuil alerte stock" type="number" value={form.alertThreshold} onChange={e => setForm(f => ({...f, alertThreshold: e.target.value}))} />
              <Select label="Plan" value={form.plan} onChange={e => setForm(f => ({...f, plan: e.target.value}))}>
                <option>Free</option><option>Pro</option><option>Enterprise</option>
              </Select>
            </div>
            <div className="flex gap-3 pt-2">
              <Btn variant="outline" onClick={() => setShowNew(false)} className="flex-1">Annuler</Btn>
              <Btn onClick={handleCreate} className="flex-1">Créer</Btn>
            </div>
          </div>
        </Modal>
      )}

      {editTenant && (
        <Modal title={`Modifier — ${editTenant.name}`} onClose={() => setEditTenant(null)} wide>
          <div className="space-y-3">
            <div className="grid grid-cols-2 gap-3">
              <Input label="Logo" value={editTenant.logo} onChange={e => setEditTenant(t => ({...t, logo: e.target.value}))} />
              <Input label="Prix unitaire produit" type="number" value={editTenant.productPrice} onChange={e => setEditTenant(t => ({...t, productPrice: e.target.value}))} />
            </div>

const UpgradePage = ({ user, setPage }) => {
  const { tenant, setTenant } = useApp();
  const currentPlan = getPlan(tenant);
  const [payState,   setPayState]   = React.useState('idle');
  const [payMsg,     setPayMsg]     = React.useState('');
  const [payInvoice, setPayInvoice] = React.useState(null);
  const [gateway,    setGateway]    = React.useState('cinetpay');

  const features = [
    { key: 'lots',      label: 'Lots de cartes',  fmt: v => v == null ? 'Illimité' : `${v} max` },
    { key: 'cards',     label: 'Cartes / mois',   fmt: v => v == null ? 'Illimité' : `${v} max` },
    { key: 'users',     label: 'Utilisateurs',    fmt: v => v == null ? 'Illimité' : `${v} max` },
    { key: 'csvExport', label: 'Export CSV',       fmt: v => v ? '✅' : '—' },
    { key: 'stats',     label: 'Statistiques',     fmt: v => v ? '✅' : '—' },
    { key: 'api',       label: 'API / Webhook',    fmt: v => v ? '✅' : '—' },
  ];

  const planOrder  = ['Free', 'Access', 'Regular', 'Pro', 'Enterprise'];
  const planColors = {
    Free:       'border-gray-200 bg-gray-50',
    Access:     'border-blue-200 bg-blue-50',
    Regular:    'border-secondary bg-secondary/10',
    Pro:        'border-primary bg-primary/10',
    Enterprise: 'border-yellow-400 bg-yellow-50',
  };

  const handlePay = (planKey) => {
    if (!tenant) return;
    const plan = PLANS[planKey];
    if (!plan || plan.price === null) {
      window.open('mailto:commercial@kadolink.app?subject=Plan%20Enterprise%20KadoLink', '_blank');
      return;
    }
    if (plan.price === 0) {
      activatePlanLocally(tenant.id, 'Free', 'free-downgrade');
      const tenants = Storage.gget('tenants') || [];
      const up = tenants.find(t => t.id === tenant.id);
      if (up) setTenant(up);
      setPayState('success');
      setPayMsg('Votre plan a été mis à jour vers Free.');
      return;
    }
    setPayState('loading');
    setPayMsg('');
    const opts = { tenant, planKey, planPrice: plan.price, userEmail: user?.email || '', userName: user?.name || tenant.name };
    const onSuccess = ({ txRef, planKey: pk, gateway: gw }) => {
      const inv = activatePlanLocally(tenant.id, pk, txRef);
      const tenants = Storage.gget('tenants') || [];
      const up = tenants.find(t => t.id === tenant.id);
      if (up) setTenant(up);
      setPayInvoice(inv);
      setPayState('success');
      setPayMsg(`Plan ${pk} activé avec succès ! (${gw})`);
    };
    const onError = (msg) => { setPayState('error'); setPayMsg(msg || 'Une erreur est survenue.'); };
    if (gateway === 'flutterwave') initFlutterwave(opts, onSuccess, onError);
    else initCinetPay(opts, onSuccess, onError);
  };

  return (
    <div className="p-4 space-y-5 fade-in">
      <div className="bg-gradient-to-r from-primary to-secondary rounded-2xl p-5 text-white">
        <div className="text-sm opacity-80">🔼 Mise à niveau</div>
        <div className="text-2xl font-black mt-1">Choisissez votre plan</div>
        <div className="text-sm opacity-70 mt-1">Plan actuel : {currentPlan.emoji} {currentPlan.label}</div>
      </div>

      <div className="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm">
        <div className="text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide">Mode de paiement</div>
        <div className="flex gap-2">
          <button onClick={() => setGateway('cinetpay')}
            className={`flex-1 py-2 rounded-xl text-xs font-bold transition border-2 ${gateway === 'cinetpay' ? 'bg-primary text-white border-primary' : 'bg-white text-gray-600 border-gray-200 hover:border-primary'}`}>
            📱 Mobile Money (UEMOA)
          </button>
          <button onClick={() => setGateway('flutterwave')}
            className={`flex-1 py-2 rounded-xl text-xs font-bold transition border-2 ${gateway === 'flutterwave' ? 'bg-secondary text-white border-secondary' : 'bg-white text-gray-600 border-gray-200 hover:border-secondary'}`}>
            💳 Carte / Internat.
          </button>
        </div>
      </div>

      {payState === 'success' && (
        <div className="bg-green-50 border border-green-200 rounded-xl p-4 text-sm text-green-800">
          <div className="font-bold mb-1">✅ {payMsg}</div>
          {payInvoice && (
            <div className="text-xs text-green-600">
              Facture {payInvoice.id} — {payInvoice.amount.toLocaleString()} FCFA
              <br/>Valable jusqu&apos;au {new Date(payInvoice.periodEnd).toLocaleDateString('fr-FR')}
            </div>
          )}
        </div>
      )}
      {payState === 'error' && (
        <div className="bg-red-50 border border-red-200 rounded-xl p-4 text-sm text-red-800">
          ❌ {payMsg}
        </div>
      )}

      <div className="space-y-3">
        {planOrder.map(planKey => {
          const plan = PLANS[planKey];
          const isCurrent    = (tenant?.plan || 'Free') === planKey;
          const isEnterprise = planKey === 'Enterprise';
          const isFree       = plan.price === 0;
          const isLoading    = payState === 'loading';
          return (
            <div key={planKey}
              className={`rounded-2xl p-4 border-2 ${planColors[planKey]} ${isCurrent ? 'ring-2 ring-secondary' : ''}`}>
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-2">
                  <span className="text-2xl">{plan.emoji}</span>
                  <div>
                    <div className="font-black text-primary text-lg">{plan.label}</div>
                    <div className="text-sm font-bold text-gray-600">
                      {isEnterprise ? 'Sur devis' : isFree ? 'Gratuit' : `${plan.price.toLocaleString()} FCFA / mois`}
                    </div>
                  </div>
                </div>
                {isCurrent && (
                  <span className="text-xs font-bold bg-secondary text-white px-3 py-1 rounded-full">Plan actuel</span>
                )}
              </div>
              <div className="grid grid-cols-2 gap-x-4 gap-y-1 mb-3">
                {features.map(f => {
                  const val = f.key === 'lots'  ? plan.maxLots :
                              f.key === 'cards' ? plan.maxCards :
                              f.key === 'users' ? plan.maxUsers :

                      <span className="font-semibold text-gray-800">{f.fmt(val)}</span>

              {!isCurrent && (

                  className={`w-full py-2.5 rounded-xl text-white text-sm font-bold transition
                    ${isEnterprise ? 'bg-yellow-500 hover:bg-yellow-600' :

          ← Retour au tableau de bord
        </button>
      )}
    </div>
  );

const SettingsPage = ({ user }) => {
  const { tenant, setTenant } = useApp();
  const [form, setForm] = useState(() => tenant ? {
    name: tenant.name, logo: tenant.logo, currency: tenant.currency,
    productName: tenant.productName, productPrice: tenant.productPrice,
    alertThreshold: tenant.alertThreshold,
    cardAmounts: (tenant.cardAmounts || []).join(','),
  } : {});
  const [pinForm, setPinForm] = useState({ current: '', newPin: '', confirm: '' });
  const [pinError, setPinError] = useState('');
  const [saved, setSaved] = useState(false);

  const handleSave = () => {
    if (!tenant) return;
    const tenants = Storage.gget('tenants') || [];
    const amounts = form.cardAmounts.split(',').map(a => parseInt(a.trim())).filter(Boolean);
    const updated = { ...tenant, ...form, cardAmounts: amounts, productPrice: parseInt(form.productPrice), alertThreshold: parseInt(form.alertThreshold) };
    Storage.gset('tenants', tenants.map(t => t.id === tenant.id ? updated : t));
    setTenant(updated);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  const handleChangePin = async () => {
    setPinError('');
    if (pinForm.current !== user.pin) return setPinError('Code PIN actuel incorrect');
    if (pinForm.newPin.length < 4) return setPinError('Nouveau PIN : minimum 4 caractères');
    if (pinForm.newPin !== pinForm.confirm) return setPinError('Les PIN ne correspondent pas');
    if (pinForm.newPin === pinForm.current) return setPinError('Le nouveau PIN doit être différent');

    // Mettre à jour dans le storage
    if (user.tenantId === 'global') {
      Storage.gset('superadmin', { ...user, pin: pinForm.newPin });
    } else {
      const users = Storage.get(user.tenantId, 'users') || [];
      Storage.set(user.tenantId, 'users', users.map(u => u.id === user.id ? {...u, pin: pinForm.newPin} : u));
    }

    // Mettre à jour Firebase Auth
    if (FB_READY && user.tenantId !== 'global') {
      await FirebaseAuth.changePin(pinForm.current, pinForm.newPin, user.matricule, user.tenantId).catch(() => {});
    }

    user.pin = pinForm.newPin;
    setPinForm({ current: '', newPin: '', confirm: '' });
    alert('✅ PIN modifié avec succès');
  };

  return (
    <div className="p-4 space-y-5 fade-in">
      <h2 className="font-bold text-primary text-lg">Paramètres</h2>

      {/* Statut Firebase */}
      <div className={`rounded-xl px-4 py-3 text-sm ${FB_READY ? 'bg-green-50 text-green-700 border border-green-100' : 'bg-amber-50 text-amber-700 border border-amber-100'}`}>
        {FB_READY ? '🔥 Firebase Firestore actif — synchronisation temps réel' : '💾 Mode local — données stockées sur cet appareil uniquement'}
      </div>

      {/* Superadmin global settings */}
      {user.role === 'superadmin' && !user.tenantId && (
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <h3 className="font-bold text-primary mb-3">⚙️ Plateforme KadoLink</h3>
          <div className="space-y-2 text-sm text-gray-600">
            <div className="flex justify-between py-2 border-b border-gray-50">
              <span className="text-gray-500">Projet Firebase</span>
              <span className="font-mono text-xs text-secondary">kadolink-b8023</span>
            </div>
            <div className="flex justify-between py-2 border-b border-gray-50">
              <span className="text-gray-500">Hosting URL</span>
              <span className="font-mono text-xs text-secondary">kadolink-b8023.web.app</span>
            </div>
            <div className="flex justify-between py-2 border-b border-gray-50">
              <span className="text-gray-500">Tenants actifs</span>
              <span className="font-semibold text-primary">{(Storage.gget('tenants') || []).filter(t => t.active).length} / {(Storage.gget('tenants') || []).length}</span>
            </div>
            <div className="flex justify-between py-2">
              <span className="text-gray-500">Synchronisation</span>
              <span className={FB_READY ? 'text-green-600 font-semibold' : 'text-amber-600 font-semibold'}>{FB_READY ? '🔥 Firestore temps réel' : '💾 localStorage'}</span>
